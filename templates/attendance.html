{% extends 'base.html' %}
{% block content %}
<div class="top-header">
    <h1>Attendance Management</h1>
</div>

<div class="card">
    <form method="POST" action="{{ url_for('save_attendance') }}">
        <div class="form-group" style="max-width: 200px;">
            <label>Date</label>
            <input type="date" name="date" class="form-control" required value="{{ today }}">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td>{{ student.roll }}</td>
                        <td>{{ student.name }}</td>
                        <td>{{ student.class }}</td>
                        <td>
                            <select name="status_{{ student.id }}" class="form-control" style="width: auto;">
                                <option value="Present">Present</option>
                                <option value="Absent">Absent</option>
                            </select>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 20px;">Save Attendance</button>
    </form>
</div>
{% endblock %}
