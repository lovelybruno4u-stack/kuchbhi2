{% extends 'student_base.html' %}
{% block content %}
<div class="content-header">
    <h1>AI Study Chatbot & Doubt Solver</h1>
    <p>Ask concept doubts, exam prep tips, or get step-by-step solutions.</p>
</div>

<div class="card" style="display: flex; flex-direction: column; height: 600px; max-height: 70vh;">
    <div id="chatHistory" style="flex: 1; overflow-y: auto; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 1rem; background: #f8fafc;">
        <div style="margin-bottom: 10px;">
            <strong>AI Tutor:</strong> Hi! I'm your AI Tutor. How can I help you today?
        </div>
    </div>

    <div style="display: flex; gap: 10px;">
        <input type="text" id="chatInput" class="form-control" style="flex: 1;" placeholder="Ask a doubt or question..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
let messages = [];

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;

    input.value = '';

    // Add user message to UI
    const chatHistory = document.getElementById('chatHistory');
    const userDiv = document.createElement('div');
    userDiv.style.marginBottom = '10px';
    userDiv.style.textAlign = 'right';
    userDiv.innerHTML = `<strong>You:</strong> <span class="user-msg"></span>`;
    userDiv.querySelector('.user-msg').textContent = msg;
    chatHistory.appendChild(userDiv);

    messages.push({role: "user", content: msg});

    chatHistory.scrollTop = chatHistory.scrollHeight;

    // Loading indicator
    const aiDiv = document.createElement('div');
    aiDiv.style.marginBottom = '10px';
    aiDiv.innerHTML = `<strong>AI Tutor:</strong> <em>Thinking...</em>`;
    chatHistory.appendChild(aiDiv);

    chatHistory.scrollTop = chatHistory.scrollHeight;

    try {
        const res = await fetch('/api/ai/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({messages})
        });
        const data = await res.json();

        const responseText = data.response || data.error;
        messages.push({role: "assistant", content: responseText});

        aiDiv.innerHTML = `<strong>AI Tutor:</strong> <span class="ai-msg"></span>`;
        aiDiv.querySelector('.ai-msg').textContent = responseText;

    } catch (e) {
        aiDiv.innerHTML = `<strong>AI Tutor:</strong> <span style="color:red;">Error occurred</span>`;
    }

    chatHistory.scrollTop = chatHistory.scrollHeight;
}
</script>
{% endblock %}
