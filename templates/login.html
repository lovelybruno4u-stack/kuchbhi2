{% extends 'base.html' %}

{% block login_content %}
<div class="login-container">
    <div class="login-card glass">
        <h1>Aswathama Classes</h1>
        <p style="margin-bottom: 2rem; color: var(--text-muted);">Welcome back! Please login.</p>

        <div class="role-selector">
            <div class="role-btn active" data-role="teacher">Teacher</div>
            <div class="role-btn" data-role="student">Student</div>
        </div>

        <form id="login-form">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username / Roll Number" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password / Phone Number" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">
                <span class="btn-text">Login</span>
                <div class="loader"></div>
            </button>
        </form>
        <p id="error-msg" style="color: #EF4444; margin-top: 1rem; display: none;"></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentRole = 'teacher';

    document.querySelectorAll('.role-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentRole = e.target.getAttribute('data-role');

            const userInp = document.getElementById('username');
            const passInp = document.getElementById('password');
            if (currentRole === 'student') {
                userInp.placeholder = "Roll Number (or 'student')";
                passInp.placeholder = "Phone Number (or 'student')";
            } else {
                userInp.placeholder = "Username (admin)";
                passInp.placeholder = "Password (admin)";
            }
        });
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const loader = btn.querySelector('.loader');
        const btnText = btn.querySelector('.btn-text');

        btnText.style.display = 'none';
        loader.classList.add('active');

        const data = {
            role: currentRole,
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (result.success) {
                window.location.href = result.redirect;
            } else {
                document.getElementById('error-msg').textContent = result.message;
                document.getElementById('error-msg').style.display = 'block';
            }
        } catch (err) {
            document.getElementById('error-msg').textContent = "An error occurred.";
            document.getElementById('error-msg').style.display = 'block';
        } finally {
            loader.classList.remove('active');
            btnText.style.display = 'inline';
        }
    });
</script>
{% endblock %}
