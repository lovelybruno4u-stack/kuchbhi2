<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ashwathama Classes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%);
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            color: #1e293b;
            font-size: 1.5rem;
            margin: 10px 0 0 0;
        }
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #e2e8f0;
            background: #fff;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            color: #64748b;
            transition: all 0.3s;
        }
        .role-btn.active {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: #4338ca;
        }
        .flashes {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }
        .flashes li {
            padding: 10px;
            border-radius: 8px;
            background: #fee2e2;
            color: #ef4444;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div style="font-size: 2rem; color: #4f46e5;"><i class="fas fa-graduation-cap"></i></div>
            <h1>Ashwathama Classes</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="flashes">
            {% for category, message in messages %}
              <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <div class="role-selector">
            <div class="role-btn active" data-role="student" onclick="setRole('student')">Student</div>
            <div class="role-btn" data-role="teacher" onclick="setRole('teacher')">Teacher</div>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="role" id="role-input" value="student">
            <div class="form-group">
                <input type="text" name="username" id="username-input" class="form-control" placeholder="Roll Number (e.g. student)" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" id="password-input" class="form-control" placeholder="Phone Number (e.g. student)" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>
        </form>
    </div>

    <script>
        function setRole(role) {
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.role-btn[data-role="${role}"]`).classList.add('active');
            document.getElementById('role-input').value = role;

            const userIn = document.getElementById('username-input');
            const passIn = document.getElementById('password-input');

            if(role === 'teacher') {
                userIn.placeholder = 'Username (admin)';
                passIn.placeholder = 'Password (admin)';
            } else {
                userIn.placeholder = 'Roll Number (e.g. student)';
                passIn.placeholder = 'Phone Number (e.g. student)';
            }
        }
    </script>
</body>
</html>
