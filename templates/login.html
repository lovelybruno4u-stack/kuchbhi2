<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ASWATHAMA CLASSES</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, var(--primary-color) 0%, #8B5CF6 100%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
        }
        .login-card h1 {
            color: var(--primary-color);
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
        .role-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .role-btn {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .role-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(79, 70, 229, 0.1);
        }
        .flashes {
            list-style: none;
            color: var(--danger-color);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card glass">
            <h1>ASWATHAMA CLASSES</h1>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <ul class="flashes">
                {% for message in messages %}
                  <li>{{ message }}</li>
                {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}

            <div class="role-selector">
                <div class="role-btn active" onclick="setRole('student', this)">Student</div>
                <div class="role-btn" onclick="setRole('teacher', this)">Teacher</div>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="role" id="roleInput" value="student">
                <input type="text" name="username" placeholder="Email or Roll No (Admin: admin)" required>
                <input type="password" name="password" placeholder="Password (Admin: admin)" id="passInput">
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Login</button>
            </form>
            <p style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);">
                Test student login: email or roll no of mock data.<br>
                Test teacher login: admin / admin
            </p>
        </div>
    </div>

    <script>
        function setRole(role, el) {
            document.getElementById('roleInput').value = role;
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');

            const passInput = document.getElementById('passInput');
            if(role === 'student') {
                passInput.placeholder = "Password (Same as Email/Roll No)";
                passInput.required = true;
            } else {
                passInput.placeholder = "Password";
                passInput.required = true;
            }
        }
        // Init
        setRole('student', document.querySelector('.role-btn'));
    </script>
</body>
</html>
