{% extends "base.html" %}

{% block title %}Login - Aswathama Classes{% endblock %}

{% block login_content %}
<div class="login-page">
    <div class="glass-card login-card">
        <h1 class="text-center mb-4">Aswathama Classes</h1>
        <p class="text-center text-muted mb-4">Sign in to your account</p>

        {% if error %}
        <div style="background: #fee2e2; color: #ef4444; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label>Select Role</label>
                <div class="role-selector">
                    <div class="role-option active" data-role="student">
                        <i class="fa-solid fa-user-graduate mb-3" style="font-size: 1.5rem; display: block;"></i>
                        Student
                    </div>
                    <div class="role-option" data-role="teacher">
                        <i class="fa-solid fa-chalkboard-user mb-3" style="font-size: 1.5rem; display: block;"></i>
                        Teacher
                    </div>
                </div>
                <input type="hidden" name="role" id="role-input" value="student">
            </div>

            <div class="form-group">
                <label for="username">Username / Roll No</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="password">Password / Phone No</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px; padding: 12px;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
