{% extends 'base.html' %}

{% block page_title %}Login{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card glass-card">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please log in to your account</p>
        </div>

        {% if error %}
            <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="login-form">
            <div class="form-group">
                <label for="role">Select Role</label>
                <select name="role" id="role" class="form-control" required>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher (Admin)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="form-control" required placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <div class="login-footer">
            <p class="demo-info">Teacher: <b>admin</b>/<b>admin</b>. Student: <b>Roll No</b> / <b>Phone</b> (or <b>student</b>/<b>student</b> if empty)</p>
        </div>
    </div>
</div>
{% endblock %}
