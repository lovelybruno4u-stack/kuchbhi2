<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ASWATHAMA CLASSES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            text-align: center;
        }
        .login-logo {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--text-primary);
        }
        .role-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .role-btn {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            color: var(--text-secondary);
        }
        .role-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(79, 70, 229, 0.05);
        }
        .error-msg {
            color: var(--danger-color);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            background: #fee2e2;
            padding: 0.5rem;
            border-radius: var(--radius-md);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="glass-card login-card">
            <div class="login-logo">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h1 class="login-title">ASWATHAMA CLASSES</h1>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="role-selector">
                    <button type="button" class="role-btn active" onclick="setRole('student', this)">
                        <i class="fas fa-user-graduate"></i> Student
                    </button>
                    <button type="button" class="role-btn" onclick="setRole('teacher', this)">
                        <i class="fas fa-chalkboard-teacher"></i> Teacher
                    </button>
                </div>
                <input type="hidden" name="role" id="role-input" value="student">

                <div class="form-group" style="text-align: left;">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Enter username">
                </div>

                <div class="form-group" style="text-align: left;">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="Enter password">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Sign In <i class="fas fa-arrow-right" style="margin-left: 0.5rem;"></i>
                </button>

                <div style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-secondary);">
                    <p>Demo Teacher: admin / admin</p>
                    <p>Demo Student: student / student</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        function setRole(role, btn) {
            document.getElementById('role-input').value = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
