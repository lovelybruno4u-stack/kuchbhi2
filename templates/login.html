<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aswathama Classes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
        }
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e5e7eb;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            transition: all var(--transition-speed);
        }
        .tab.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: -2px;
        }
        .login-form {
            display: none;
        }
        .login-form.active {
            display: block;
        }
        #error-msg {
            color: var(--danger);
            text-align: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>ASWATHAMA</h1>
                <p>Sign in to your account</p>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('student')">Student</div>
                <div class="tab" onclick="switchTab('teacher')">Teacher</div>
            </div>

            <div id="error-msg"></div>

            <!-- Student Login Form -->
            <form id="student-form" class="login-form active" onsubmit="handleLogin(event, 'student')">
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="student_id" class="form-control" placeholder="Enter your ID" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login as Student</button>
            </form>

            <!-- Teacher Login Form -->
            <form id="teacher-form" class="login-form" onsubmit="handleLogin(event, 'teacher')">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="teacher_user" class="form-control" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="teacher_pass" class="form-control" placeholder="admin" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login as Teacher</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        function switchTab(role) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.login-form').forEach(f => f.classList.remove('active'));
            document.getElementById('error-msg').innerText = '';

            if(role === 'student') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('student-form').classList.add('active');
            } else {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('teacher-form').classList.add('active');
            }
        }

        async function handleLogin(e, role) {
            e.preventDefault();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = '';

            let data = { role: role };
            if (role === 'student') {
                data.student_id = document.getElementById('student_id').value;
            } else {
                data.username = document.getElementById('teacher_user').value;
                data.password = document.getElementById('teacher_pass').value;
            }

            const res = await apiCall('/api/login', 'POST', data);
            if (res.success) {
                window.location.href = res.redirect;
            } else {
                errorMsg.innerText = res.message || 'Login failed';
            }
        }
    </script>
</body>
</html>
