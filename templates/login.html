{% extends 'base.html' %}
{% block content %}
<div class="login-container">
    <div class="card login-card">
        <h2 style="text-align: center; margin-bottom: 20px;">Welcome Back</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label>Login As</label>
                <div class="role-selector">
                    <div class="role-option selected" data-role="student">Student</div>
                    <div class="role-option" data-role="teacher">Teacher</div>
                </div>
                <input type="hidden" name="role" id="role-input" value="student">
            </div>

            <div class="form-group">
                <label>Username / Roll No</label>
                <input type="text" name="username" class="form-control" required placeholder="Enter username">
            </div>

            <div class="form-group">
                <label>Password / Phone</label>
                <input type="password" name="password" class="form-control" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 0.9em; color: var(--text-muted);">
            Demo: admin/admin (Teacher) or student/student (Student)
        </p>
    </div>
</div>
{% endblock %}
