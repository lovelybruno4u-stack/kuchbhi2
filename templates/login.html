<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ASWATHAMA CLASSES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f6f8fd 0%, #f1f6fd 100%); }
        .login-container { width: 100%; max-width: 400px; }
        .login-card { padding: 2.5rem; text-align: center; }
        .login-logo { font-size: 3rem; color: var(--primary); margin-bottom: 1rem; }
        .login-title { margin-bottom: 2rem; }
        .role-selector { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .role-btn { flex: 1; padding: 0.75rem; border: 2px solid var(--border); border-radius: 0.5rem; background: white; cursor: pointer; transition: var(--transition); font-weight: 600; color: var(--text-muted); }
        .role-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(79, 70, 229, 0.05); }
        .form-section { display: none; text-align: left; }
        .form-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card login-card glassmorphism">
            <i class="fa-solid fa-graduation-cap login-logo"></i>
            <h2 class="login-title">ASWATHAMA CLASSES</h2>

            <div class="role-selector">
                <button class="role-btn active" onclick="setRole('student')">Student</button>
                <button class="role-btn" onclick="setRole('teacher')">Teacher</button>
            </div>

            <!-- Student Login -->
            <div id="studentForm" class="form-section active">
                <div class="form-group">
                    <label class="form-label">Student ID</label>
                    <input type="text" id="studentId" class="form-control" placeholder="Enter your ID (e.g. 101)">
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="handleLogin('student')">Login as Student</button>
            </div>

            <!-- Teacher Login -->
            <div id="teacherForm" class="form-section">
                <div class="form-group">
                    <label class="form-label">Admin Password</label>
                    <input type="password" id="teacherPassword" class="form-control" placeholder="Enter admin password">
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="handleLogin('teacher')">Login as Teacher</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="globalModal" style="display: none;">
        <div class="modal-card glassmorphism">
            <div class="modal-header">
                <h3 id="modalTitle">Notice</h3>
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeModal()">OK</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        let currentRole = 'student';

        function setRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(role + 'Form').classList.add('active');
        }

        async function handleLogin(role) {
            const payload = { role: role };
            if (role === 'student') {
                const id = document.getElementById('studentId').value;
                if(!id) return showModal('Error', 'Please enter Student ID');
                payload.student_id = id;
            } else {
                const pwd = document.getElementById('teacherPassword').value;
                if(!pwd) return showModal('Error', 'Please enter Password');
                payload.password = pwd;
            }

            const res = await apiCall('/login', 'POST', payload);
            if(res && res.success) {
                window.location.href = res.redirect;
            } else if (res) {
                showModal('Login Failed', res.error);
            }
        }
    </script>
</body>
</html>
