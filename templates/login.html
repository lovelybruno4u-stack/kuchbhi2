<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aswathama Classes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="glass-panel auth-card">
            <h1>Aswathama Classes</h1>

            <div class="tabs">
                <div class="tab active" onclick="switchRole('Student')" id="tab-student">Student</div>
                <div class="tab" onclick="switchRole('Teacher')" id="tab-teacher">Teacher</div>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="hidden" id="role" value="Student">

                <div class="form-group">
                    <label id="usernameLabel">Email or Phone</label>
                    <input type="text" id="username" required placeholder="Enter your email or phone">
                </div>

                <div class="form-group">
                    <label id="passwordLabel">Roll Number</label>
                    <input type="password" id="password" required placeholder="Enter your roll number">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;" id="loginBtn">Login</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        function switchRole(role) {
            document.getElementById('role').value = role;

            if(role === 'Teacher') {
                document.getElementById('tab-teacher').classList.add('active');
                document.getElementById('tab-student').classList.remove('active');
                document.getElementById('usernameLabel').innerText = 'Username';
                document.getElementById('passwordLabel').innerText = 'Password';
                document.getElementById('username').placeholder = 'admin';
                document.getElementById('password').placeholder = 'admin';
            } else {
                document.getElementById('tab-student').classList.add('active');
                document.getElementById('tab-teacher').classList.remove('active');
                document.getElementById('usernameLabel').innerText = 'Email or Phone';
                document.getElementById('passwordLabel').innerText = 'Roll Number';
                document.getElementById('username').placeholder = 'Enter your email or phone';
                document.getElementById('password').placeholder = 'Enter your roll number';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="loader" style="width: 16px; height: 16px; border-width: 2px;"></span> Loading...';
            btn.disabled = true;

            const role = document.getElementById('role').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = await apiCall('/login', 'POST', { role, username, password });

            if(res.success) {
                window.location.href = res.redirect;
            } else {
                showAlert(res.error || 'Login failed', 'error');
                btn.innerHTML = 'Login';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
