<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aswathama Classes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-card glass">
        <div class="logo">Aswathama Classes</div>

        {% if error %}
            <div style="background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 24px; text-align: center;">
                {{ error }}
            </div>
        {% endif %}

        <div class="role-selector">
            <div class="role-option selected" data-role="student" onclick="selectRole('student')">Student</div>
            <div class="role-option" data-role="teacher" onclick="selectRole('teacher')">Teacher</div>
        </div>

        <form method="POST" action="{{ url_for('login') }}" id="login-form">
            <input type="hidden" name="role" id="role-input" value="student">

            <div id="student-fields">
                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" name="roll" class="form-control" placeholder="Enter roll number">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="Enter phone number">
                </div>
            </div>

            <div id="teacher-fields" class="hidden">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" placeholder="admin">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Login</button>
        </form>
    </div>

    <script>
        function selectRole(role) {
            document.querySelectorAll('.role-option').forEach(el => el.classList.remove('selected'));
            document.querySelector(`.role-option[data-role="${role}"]`).classList.add('selected');
            document.getElementById('role-input').value = role;

            if (role === 'student') {
                document.getElementById('student-fields').classList.remove('hidden');
                document.getElementById('teacher-fields').classList.add('hidden');
            } else {
                document.getElementById('student-fields').classList.add('hidden');
                document.getElementById('teacher-fields').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
