<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ASWATHAMA CLASSES</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .role-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .role-option {
            flex: 1;
            padding: 1rem;
            border: 2px solid var(--light);
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
        }
        .role-option.selected {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
        }
        .login-header {
            margin-bottom: 2rem;
            color: var(--dark);
        }
        .error-message {
            color: #EF4444;
            background: #FEE2E2;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <h1 class="login-header">ASWATHAMA CLASSES</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Welcome back! Please login to your account.</p>

        <div id="login-error" class="error-message"></div>

        <div class="role-selector" id="role-selector">
            <div class="role-option selected" data-role="student">Student</div>
            <div class="role-option" data-role="teacher">Teacher</div>
        </div>

        <form id="login-form">
            <!-- Student Fields -->
            <div id="student-fields">
                <div class="form-group">
                    <input type="text" id="roll_no" class="form-control" placeholder="Roll Number (e.g., student)">
                </div>
                <div class="form-group">
                    <input type="text" id="phone" class="form-control" placeholder="Phone Number (e.g., student)">
                </div>
            </div>

            <!-- Teacher Fields -->
            <div id="teacher-fields" style="display: none;">
                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder="Username (admin)">
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Password (admin)">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 1rem; margin-top: 1rem;">
                Login
            </button>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
