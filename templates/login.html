<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashwathama Classes - Login</title>
    <!-- Open Graph / WhatsApp / Facebook Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kuchbhi2.onrender.com/">
    <meta property="og:title" content="Ashwathama Classes">
    <meta property="og:description" content="Learn Practically. Smart Student Dashboard and Teacher Portal for Ashwathama Classes.">
    <meta property="og:image" content="https://kuchbhi2.onrender.com/static/icon-512.png">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://kuchbhi2.onrender.com/">
    <meta property="twitter:title" content="Ashwathama Classes">
    <meta property="twitter:description" content="Learn Practically. Smart Student Dashboard and Teacher Portal for Ashwathama Classes.">
    <meta property="twitter:image" content="https://kuchbhi2.onrender.com/static/icon-512.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Load FontAwesome via CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <div class="login-container">
        <div class="glass-card login-card">
            <div class="login-header">
                <h1>Ashwathama Classes</h1>
                <p style="color: var(--text-secondary);">Welcome back! Please login to your account.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}" style="color: var(--danger); text-align: center; margin-bottom: 15px; font-weight: 500;">
                            <i class="fas fa-exclamation-circle"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="role-toggle">
                    <div class="role-btn active" data-role="student">
                        <i class="fas fa-user-graduate"></i> Student
                    </div>
                    <div class="role-btn" data-role="teacher">
                        <i class="fas fa-chalkboard-teacher"></i> Teacher
                    </div>
                </div>
                <input type="hidden" name="role" id="role-input" value="student">

                <div class="form-group">
                    <label for="username" id="username-label">Username (Teachers) / Roll Number (Students)</label>
                    <input type="text" id="username" name="username" class="form-control" required placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="Enter password">
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <button type="button" id="biometric-login-btn" class="btn btn-outline" style="width: 100%; display: none; padding: 12px; border-color: var(--secondary-color); color: var(--secondary-color);">
                        <i class="fas fa-fingerprint"></i> Use Device Biometrics / Screen Lock
                    </button>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        // Set up the role toggle behavior specific to the login page
        document.addEventListener('DOMContentLoaded', () => {
            const roleBtns = document.querySelectorAll('.role-btn');
            const roleInput = document.getElementById('role-input');

            roleBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    roleBtns.forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active'); // Use currentTarget to capture the div, not icon
                    roleInput.value = e.currentTarget.getAttribute('data-role');
                });
            });
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
                    .then(registration => console.log('ServiceWorker registered with scope:', registration.scope))
                    .catch(err => console.error('ServiceWorker registration failed:', err));
            });
        }

        // Biometric Login Logic
        const bioBtn = document.getElementById('biometric-login-btn');
        const roleInputBio = document.getElementById('role-input');

        // Check if device supports biometrics and if user has registered
        if (window.PublicKeyCredential && localStorage.getItem('bio_registered') === 'true') {
            bioBtn.style.display = 'inline-flex';
        }

        if (bioBtn) {
            bioBtn.addEventListener('click', async () => {
                try {
                    // Fetch the stored credential ID
                    const credIdStr = localStorage.getItem('bio_cred_id');
                    if (!credIdStr) throw new Error("No credential found.");

                    const credId = new Uint8Array(JSON.parse(credIdStr)).buffer;

                    // Request biometric assertion
                    const assertion = await navigator.credentials.get({
                        publicKey: {
                            challenge: new Uint8Array([1, 2, 3, 4, 5, 6, 7, 8]), // Dummy challenge for local verification
                            allowCredentials: [{
                                id: credId,
                                type: 'public-key'
                            }],
                            userVerification: "required", // Forces FaceID/Fingerprint/Screenlock
                            timeout: 60000
                        }
                    });

                    if (assertion) {
                        // Biometric successful, retrieve stored credentials
                        const storedUser = localStorage.getItem('bio_user');
                        const storedPass = localStorage.getItem('bio_pass');
                        const storedRole = localStorage.getItem('bio_role') || 'student';

                        if(storedUser && storedPass) {
                            document.getElementById('username').value = storedUser;
                            document.getElementById('password').value = storedPass;
                            roleInputBio.value = storedRole;

                            // Auto submit form
                            bioBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
                            document.querySelector('form').submit();
                        } else {
                            alert("Stored credentials missing. Please login manually and re-register your device.");
                        }
                    }
                } catch (e) {
                    console.error("Biometric login failed:", e);
                    if(e.name !== 'NotAllowedError') {
                        alert("Biometric verification failed or was cancelled.");
                    }
                }
            });
        }

</script>
</body>
</html>
