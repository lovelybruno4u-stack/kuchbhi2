{% extends "base.html" %}

{% block title %}Announcements{% endblock %}

{% block content %}
<div class="flex-between mb-4">
    <h1>Class Announcements</h1>
</div>

<div class="dashboard-grid" id="ann-container">
    <div style="grid-column: 1 / -1;" class="text-center text-muted">Loading announcements...</div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    async function loadAnnouncements() {
        try {
            const data = await apiCall('/api/announcements');
            const container = document.getElementById('ann-container');
            container.innerHTML = '';

            if(data.length === 0) {
                container.innerHTML = '<div style="grid-column: 1 / -1;" class="glass-card text-center text-muted">No announcements found.</div>';
                return;
            }

            data.reverse().forEach(a => {
                container.innerHTML += `
                    <div class="glass-card" style="grid-column: 1 / -1;">
                        <div class="mb-3 text-muted">
                            <i class="fa-regular fa-calendar"></i> ${a.date}
                        </div>
                        <p style="white-space: pre-wrap; font-size: 1.1rem;">${a.message}</p>
                    </div>
                `;
            });
        } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', loadAnnouncements);
</script>
{% endblock %}
