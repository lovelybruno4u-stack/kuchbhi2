<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    {% include 'sidebar_student.html' %}
    <div class="main-content">
        <div class="topbar">
            <h2>Announcements</h2>
            <div class="topbar-right">
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
        </div>
        <div class="container">
            <div class="grid grid-cols-1">
                {% for announcement in announcements %}
                <div class="card">
                    <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 0.5rem;">Date: {{ announcement.date }}</p>
                    <p style="white-space: pre-wrap;">{{ announcement.message }}</p>
                </div>
                {% else %}
                <p style="color: var(--text-muted);">No announcements available.</p>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
