{% extends 'base.html' %}
{% block page_title %}Announcements{% endblock %}
{% block content %}

<div class="dashboard-grid" id="announcementsGrid" style="display: flex; flex-direction: column; gap: 1rem;">
    <p>Loading announcements...</p>
</div>

{% endblock %}
{% block extra_js %}
<script>
    async function loadAnnouncements() {
        const res = await apiCall('/api/announcements');
        const grid = document.getElementById('announcementsGrid');
        if(res.success) {
            if(res.data.length === 0) {
                grid.innerHTML = '<p>No announcements.</p>';
                return;
            }
            grid.innerHTML = res.data.reverse().map(a => `
                <div class="glass-panel" style="padding: 1.5rem; border-left: 4px solid var(--primary-color);">
                    <div style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 0.5rem;">${a.date}</div>
                    <div style="font-size: 1.125rem; white-space: pre-wrap;">${a.message}</div>
                </div>
            `).join('');
        }
    }
    loadAnnouncements();
</script>
{% endblock %}
