{% extends "base.html" %}

{% block title %}Announcements{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 800px; margin: 0 auto;">
    <div id="studentAnnouncementsList" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="empty-state"><div class="loading-spinner" style="border-top-color: var(--primary-color);"></div></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadStudentAnnouncements() {
        const list = document.getElementById('studentAnnouncementsList');
        const anns = await fetchData('/api/announcements');

        if (!anns || anns.length === 0) {
            list.innerHTML = '<div class="empty-state"><i class="fas fa-bullhorn"></i><p>No new announcements.</p></div>';
            return;
        }

        anns.sort((a, b) => new Date(b.date) - new Date(a.date));

        list.innerHTML = '';
        anns.forEach(a => {
            const div = document.createElement('div');
            div.style.padding = '1.5rem';
            div.style.border = '1px solid var(--border-color)';
            div.style.borderRadius = 'var(--radius-md)';
            div.style.background = '#fff';

            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.5rem;">
                    <span style="font-size: 0.8rem; color: var(--text-secondary);">
                        <i class="far fa-clock"></i> ${formatDate(a.date)}
                    </span>
                    <span style="background: #fef3c7; color: #b45309; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight:600;">NEW</span>
                </div>
                <div style="white-space: pre-wrap; color: var(--text-primary); line-height: 1.5;">${a.message}</div>
            `;
            list.appendChild(div);
        });
    }

    loadStudentAnnouncements();
</script>
{% endblock %}
