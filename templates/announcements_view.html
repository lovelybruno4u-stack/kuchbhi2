{% extends "student_base.html" %}

{% block page_title %}Announcements{% endblock %}

{% block content %}
<div class="glass" style="max-width: 800px; padding: 2rem;">
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        {% for ann in announcements|reverse %}
        <div style="border-left: 4px solid var(--primary-color); padding: 1.5rem; background: rgba(255,255,255,0.5); border-radius: 0 8px 8px 0; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; font-weight: 500;">
                <i class="far fa-calendar-alt text-primary"></i>
                Posted on {{ ann.date }}
            </div>
            <p style="white-space: pre-wrap; font-size: 1rem; line-height: 1.6; color: var(--text-main);">{{ ann.message }}</p>
        </div>
        {% else %}
        <div style="text-align: center; padding: 3rem;">
            <i class="far fa-bell-slash" style="font-size: 3rem; color: var(--border-color); margin-bottom: 1rem;"></i>
            <p style="color: var(--text-muted);">No announcements have been posted yet.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
