{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div class="page-title">
        <h1>Overview</h1>
        <p>Welcome back, Teacher.</p>
    </div>
</div>

<div class="dashboard-grid">
    <div class="stat-card glass">
        <div class="stat-icon blue">
            <i class="fas fa-users"></i>
        </div>
        <div class="stat-details">
            <h3>{{ total_students }}</h3>
            <p>Total Students</p>
        </div>
    </div>

    <div class="stat-card glass">
        <div class="stat-icon green">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="stat-details">
            <h3>{{ present_today }}</h3>
            <p>Present Today</p>
        </div>
    </div>
</div>

<div class="glass" style="padding: 24px;">
    <h3>Quick Actions</h3>
    <div style="display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap;">
        <a href="{{ url_for('teacher_students') }}" class="btn btn-secondary"><i class="fas fa-user-plus"></i> Add Student</a>
        <a href="{{ url_for('teacher_attendance') }}" class="btn btn-secondary"><i class="fas fa-calendar-check"></i> Mark Attendance</a>
        <a href="{{ url_for('teacher_videos') }}" class="btn btn-secondary"><i class="fas fa-video"></i> Upload Video</a>
    </div>
</div>
{% endblock %}
