{% extends 'base.html' %}
{% block page_title %}Teacher Dashboard{% endblock %}
{% block content %}
<div class="dashboard-grid">
    <div class="glass-panel stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        <div class="stat-details">
            <h3>Total Students</h3>
            <p id="totalStudents">-</p>
        </div>
    </div>
    <div class="glass-panel stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
        <div class="stat-details">
            <h3>Today Present</h3>
            <p id="todayPresent">-</p>
        </div>
    </div>
    <div class="glass-panel stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div class="stat-details">
            <h3>Date</h3>
            <p id="currentDate"></p>
        </div>
    </div>
</div>

<div class="glass-panel" style="padding: 1.5rem;">
    <h3 style="margin-bottom: 1rem;">Quick Actions</h3>
    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
        <a href="/teacher/attendance" class="btn btn-primary">Mark Attendance</a>
        <a href="/teacher/videos" class="btn btn-secondary">Upload Class Video</a>
        <a href="/teacher/announcements" class="btn btn-secondary">New Announcement</a>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString();

    async function loadStats() {
        const res = await apiCall('/api/teacher/dashboard-stats');
        if(res.success) {
            document.getElementById('totalStudents').innerText = res.total_students;
            document.getElementById('todayPresent').innerText = `${res.today_present} / ${res.today_total}`;
        }
    }
    loadStats();
</script>
{% endblock %}
