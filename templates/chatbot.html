{% extends 'student_base.html' %}

{% block title %}AI Study Chatbot{% endblock %}
{% block page_title %}AI Study Chatbot 🤖{% endblock %}

{% block content %}
<div class="glass-card">
    <div style="display: flex; flex-direction: column; height: 60vh;">
        <div id="chat-history" style="flex: 1; overflow-y: auto; padding: 15px; background: #f8fafc; border-radius: 10px; margin-bottom: 20px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 15px;">
            <div style="align-self: flex-start; background: #e0e7ff; padding: 12px 18px; border-radius: 15px; border-bottom-left-radius: 2px; max-width: 80%; color: #3730a3; font-weight: 500;">
                Hello! I am your AI Study Tutor. Ask me any concept doubt, exam tips, or study advice!
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <input type="text" id="chat-input" class="form-input" placeholder="Type your message here..." style="flex: 1; border-radius: 20px; padding: 12px 20px;" onkeypress="if(event.key === 'Enter') sendChatMessage()">
            <button class="btn btn-primary" onclick="sendChatMessage()" style="border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; padding: 0;">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<script>
    let chatContext = [];

    function appendMessage(text, sender) {
        const historyDiv = document.getElementById('chat-history');
        const msgDiv = document.createElement('div');
        msgDiv.style.padding = '12px 18px';
        msgDiv.style.borderRadius = '15px';
        msgDiv.style.maxWidth = '80%';
        msgDiv.style.marginBottom = '10px';

        if(sender === 'user') {
            msgDiv.style.alignSelf = 'flex-end';
            msgDiv.style.background = '#4f46e5';
            msgDiv.style.color = 'white';
            msgDiv.style.borderBottomRightRadius = '2px';
        } else {
            msgDiv.style.alignSelf = 'flex-start';
            msgDiv.style.background = '#e0e7ff';
            msgDiv.style.color = '#3730a3';
            msgDiv.style.fontWeight = '500';
            msgDiv.style.borderBottomLeftRadius = '2px';
        }

        // Prevent XSS
        msgDiv.textContent = text;
        historyDiv.appendChild(msgDiv);
        historyDiv.scrollTop = historyDiv.scrollHeight;
    }

    async function sendChatMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if(!message) return;

        input.value = '';
        appendMessage(message, 'user');

        chatContext.push({"role": "user", "content": message});

        try {
            const response = await fetch('/api/ai/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ messages: chatContext })
            });
            const data = await response.json();

            if(data.success) {
                appendMessage(data.reply, 'ai');
                chatContext.push({"role": "assistant", "content": data.reply});
            } else {
                appendMessage("Sorry, I encountered an error. Please try again.", 'ai');
            }
        } catch(e) {
            appendMessage("Network error. Please check your connection.", 'ai');
        }
    }
</script>
{% endblock %}
