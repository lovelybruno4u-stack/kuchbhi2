<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - ASWATHAMA CLASSES</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-brand">ASWATHAMA</div>
        <ul class="nav-links">
            <li class="nav-item"><a href="/student_dashboard" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a href="/my_videos" class="nav-link">Class Videos</a></li>
            <li class="nav-item"><a href="/attendance_view" class="nav-link">My Attendance</a></li>
            <li class="nav-item"><a href="/chatbot" class="nav-link active" style="background: linear-gradient(90deg, #4F46E5, #a855f7); color: white;">AI Tutor</a></li>
            <li class="nav-item"><a href="/announcements_view" class="nav-link">Announcements</a></li>
        </ul>
        <button id="logout-btn" class="logout-btn">Logout</button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="topbar">
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
            <h1 class="page-title">AI Study Chatbot</h1>
        </div>

        <div class="card" style="max-width: 800px; margin: 0 auto; display: flex; flex-direction: column;">
            <div id="chat-messages" class="chat-container">
                <div class="chat-message ai">
                    Hello! I'm your AI Tutor. Ask me any concept doubts, exam prep questions, or for study tips!
                </div>
                <!-- Dynamic messages go here -->
            </div>

            <form id="chatbot-form" style="display: flex; gap: 1rem;">
                <input type="text" id="chat-input" class="form-control" placeholder="Type your message..." style="flex: 1;" required autocomplete="off">
                <button type="submit" class="btn btn-primary" style="background: #a855f7; border: none;">Send</button>
            </form>
        </div>
    </main>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
