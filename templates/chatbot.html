{% extends 'student_base.html' %}

{% block content %}
<style>
.chat-container {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    height: 70vh;
    margin-bottom: 20px;
}
.chat-history {
    flex-grow: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.chat-bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.5;
}
.chat-user {
    align-self: flex-end;
    background: #4f46e5;
    color: white;
    border-bottom-right-radius: 4px;
}
.chat-bot {
    align-self: flex-start;
    background: #f1f5f9;
    color: #1e293b;
    border-bottom-left-radius: 4px;
}
.chat-input-container {
    display: flex;
    padding: 16px;
    border-top: 1px solid #e2e8f0;
}
.chat-input {
    flex-grow: 1;
    padding: 12px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    outline: none;
}
.chat-send {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 12px 24px;
    margin-left: 12px;
    border-radius: 8px;
    cursor: pointer;
}
.mode-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}
.mode-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    background: white;
    cursor: pointer;
}
.mode-btn.active {
    background: #4f46e5;
    color: white;
    border-color: #4f46e5;
}
</style>

<div class="content-header">
    <h1>AI Assistant</h1>
</div>

<div class="mode-selector">
    <button class="mode-btn active" onclick="setMode('tutor', this)">Study Chatbot</button>
    <button class="mode-btn" onclick="setMode('doubt', this)">Doubt Solver</button>
</div>

<div class="chat-container">
    <div class="chat-history" id="chatHistory">
        <!-- Messages appended here -->
    </div>
    <div class="chat-input-container">
        <input type="text" id="chatInput" class="chat-input" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" class="chat-send">Send</button>
    </div>
</div>

<script>
let currentMode = 'tutor';
let chatHistoryArray = [];

function setMode(mode, btnElement) {
    currentMode = mode;
    chatHistoryArray = []; // Clear history on mode change
    document.getElementById('chatHistory').innerHTML = '';

    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');

    const welcomeText = mode === 'tutor'
        ? "Hi! I'm your AI Study Chatbot. How can I help you with your exam prep or concepts today?"
        : "Hi! I'm your AI Doubt Solver. Ask me any question, and I'll explain it simply!";
    appendMessage('bot', welcomeText);
}

function appendMessage(sender, text) {
    const historyDiv = document.getElementById('chatHistory');
    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble ' + (sender === 'user' ? 'chat-user' : 'chat-bot');
    bubble.appendChild(document.createTextNode(text)); // Prevent XSS
    historyDiv.appendChild(bubble);
    historyDiv.scrollTop = historyDiv.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;

    appendMessage('user', text);
    chatHistoryArray.push({role: 'user', content: text});
    input.value = '';

    try {
        const response = await fetch('/api/ai/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                mode: currentMode,
                history: chatHistoryArray
            })
        });

        const data = await response.json();
        if(data.success) {
            appendMessage('bot', data.reply);
            chatHistoryArray.push({role: 'assistant', content: data.reply});
        } else {
            showCustomModal("Error: " + data.error);
        }
    } catch(err) {
        showCustomModal("Connection failed.");
    }
}

// Initial welcome
setMode('tutor', document.querySelector('.mode-btn'));
</script>
{% endblock %}
