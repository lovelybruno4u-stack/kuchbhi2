{% extends 'student_base.html' %}

{% block title %}AI Study Chatbot{% endblock %}
{% block page_title %}AI Study Chatbot{% endblock %}

{% block content %}
<div class="glass-card" style="display: flex; flex-direction: column; height: 70vh; max-width: 800px; margin: 0 auto; padding: 20px;">
    <div id="chat-history" style="flex-grow: 1; overflow-y: auto; padding: 10px; border-bottom: 1px solid #e5e7eb; margin-bottom: 15px; display: flex; flex-direction: column; gap: 15px;">
        <div class="message ai-message" style="background: #f3f4f6; padding: 12px 16px; border-radius: 12px; align-self: flex-start; max-width: 80%;">
            Hello! I am your AI Study Tutor. Ask me any concept doubt or ask for study tips!
        </div>
    </div>

    <div style="display: flex; gap: 10px;">
        <input type="text" id="chat-input" class="form-control" placeholder="Type your question here..." style="flex-grow: 1;">
        <button id="send-btn" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Send</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const chatHistory = [];
    const chatContainer = document.getElementById('chat-history');
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.style.padding = '12px 16px';
        div.style.borderRadius = '12px';
        div.style.maxWidth = '80%';
        div.style.marginBottom = '10px';

        if (role === 'user') {
            div.style.background = 'var(--primary-color)';
            div.style.color = 'white';
            div.style.alignSelf = 'flex-end';
        } else {
            div.style.background = '#f3f4f6';
            div.style.color = 'var(--text-primary)';
            div.style.alignSelf = 'flex-start';
        }

        div.textContent = text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        appendMessage('user', text);
        chatHistory.push({ role: 'user', content: text });
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;

        try {
            const response = await fetch('/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    history: chatHistory,
                    type: 'chatbot'
                })
            });

            const data = await response.json();
            if (data.success) {
                appendMessage('ai', data.reply);
                chatHistory.push({ role: 'assistant', content: data.reply });
            } else {
                showToast(data.error || 'Failed to get AI response', 'error');
            }
        } catch (error) {
            console.error('Error:', error);
            showToast('Network error while contacting AI', 'error');
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
{% endblock %}
