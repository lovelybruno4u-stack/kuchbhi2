<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    {% include 'sidebar_teacher.html' %}
    <div class="main-content">
        <div class="topbar">
            <h2>Students Management</h2>
            <div class="topbar-right">
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
        </div>
        <div class="container">
            <div class="page-header">
                <h3>All Students</h3>
                <button class="btn btn-primary" onclick="openModal('addStudentModal')">Add Student</button>
            </div>


            <div class="page-header" style="margin-bottom: 1rem;">
                <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="Search students by name or roll no..." style="max-width: 300px;">
            </div>
            <script>
            function searchTable() {
              var input, filter, table, tr, tdName, tdRoll, i, txtValueName, txtValueRoll;
              input = document.getElementById("searchInput");
              filter = input.value.toUpperCase();
              table = document.querySelector("table");
              tr = table.getElementsByTagName("tr");
              for (i = 1; i < tr.length; i++) {
                tdRoll = tr[i].getElementsByTagName("td")[0];
                tdName = tr[i].getElementsByTagName("td")[1];
                if (tdName || tdRoll) {
                  txtValueName = tdName.textContent || tdName.innerText;
                  txtValueRoll = tdRoll.textContent || tdRoll.innerText;
                  if (txtValueName.toUpperCase().indexOf(filter) > -1 || txtValueRoll.toUpperCase().indexOf(filter) > -1) {
                    tr[i].style.display = "";
                  } else {
                    tr[i].style.display = "none";
                  }
                }
              }
            }
            </script>
<div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Roll No</th>
                            <th>Name</th>
                            <th>Class</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td>{{ student.roll }}</td>
                            <td>{{ student.name }}</td>
                            <td>{{ student.class }}</td>
                            <td>{{ student.phone }}</td>
                            <td>
                                <form action="/teacher/delete_student/{{ student.id }}" method="POST" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="addStudentModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1.5rem;">Add New Student</h3>
            <form action="/teacher/add_student" method="POST">
                <div style="margin-bottom: 1rem;">
                    <label>Name</label>
                    <input type="text" name="name" required>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label>Class</label>
                    <input type="text" name="student_class" required>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label>Roll Number</label>
                    <input type="text" name="roll" required>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label>Phone</label>
                    <input type="text" name="phone">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label>Email</label>
                    <input type="email" name="email">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label>Parent Name</label>
                    <input type="text" name="parent">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addStudentModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
