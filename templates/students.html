{% extends 'base.html' %}
{% block page_title %}Student Management{% endblock %}
{% block content %}

<div class="card" style="margin-bottom: 2rem;">
    <h3>Add New Student</h3>
    <div class="grid-3" style="margin-top: 1rem;">
        <div class="form-group"><label class="form-label">Name</label><input type="text" id="sName" class="form-control"></div>
        <div class="form-group"><label class="form-label">Class</label><input type="text" id="sClass" class="form-control"></div>
        <div class="form-group"><label class="form-label">Roll No</label><input type="text" id="sRoll" class="form-control"></div>
        <div class="form-group"><label class="form-label">Phone</label><input type="text" id="sPhone" class="form-control"></div>
        <div class="form-group"><label class="form-label">Email</label><input type="email" id="sEmail" class="form-control"></div>
        <div class="form-group"><label class="form-label">Parent Name</label><input type="text" id="sParent" class="form-control"></div>
    </div>
    <button class="btn btn-primary" onclick="addStudent()">Add Student</button>
</div>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3>Student List</h3>
        <input type="text" id="searchInput" class="form-control" style="width: 250px;" placeholder="Search students..." onkeyup="filterTable()">
    </div>
    <div class="table-container">
        <table id="studentsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Roll No</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentsBody"></tbody>
        </table>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script>
    async function loadStudents() {
        const students = await apiCall('/api/students');
        const tbody = document.getElementById('studentsBody');
        tbody.innerHTML = '';
        if(students) {
            students.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td>${s.id}</td>
                        <td>${s.name}</td>
                        <td>${s.class}</td>
                        <td>${s.roll}</td>
                        <td>${s.phone}</td>
                        <td><button class="btn btn-danger" onclick="deleteStudent('${s.id}')"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `;
            });
        }
    }

    async function addStudent() {
        const data = {
            name: document.getElementById('sName').value,
            class: document.getElementById('sClass').value,
            roll: document.getElementById('sRoll').value,
            phone: document.getElementById('sPhone').value,
            email: document.getElementById('sEmail').value,
            parent: document.getElementById('sParent').value
        };
        const res = await apiCall('/api/students', 'POST', data);
        if(res && res.success) {
            showModal('Success', 'Student added successfully! ID: ' + res.id);
            loadStudents();
            document.querySelectorAll('input').forEach(i => i.value = '');
        }
    }

    async function deleteStudent(id) {
        if(confirm('Are you sure you want to delete this student?')) {
            const res = await apiCall(`/api/students/${id}`, 'DELETE');
            if(res && res.success) loadStudents();
        }
    }

    function filterTable() {
        const input = document.getElementById("searchInput").value.toUpperCase();
        const tr = document.getElementById("studentsTable").getElementsByTagName("tr");
        for (let i = 1; i < tr.length; i++) {
            let text = tr[i].textContent || tr[i].innerText;
            tr[i].style.display = text.toUpperCase().indexOf(input) > -1 ? "" : "none";
        }
    }

    document.addEventListener('DOMContentLoaded', loadStudents);
</script>
{% endblock %}
