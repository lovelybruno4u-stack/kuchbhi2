{% extends 'student/base.html' %}

{% block content %}
<div class="content-header">
    <h2><i class="fas fa-robot"></i> AI Study Chatbot & Doubt Solver</h2>
    <p>Ask concept doubts, exam prep questions, or get study tips!</p>
</div>

<div class="glass-card">
    <div id="chat-container" style="height: 400px; overflow-y: auto; padding: 15px; border-bottom: 1px solid var(--border-color); margin-bottom: 15px;">
        <!-- Chat messages will appear here -->
        <div class="chat-message ai-message" style="margin-bottom: 15px; text-align: left;">
            <div style="display: inline-block; background-color: var(--card-bg); padding: 10px 15px; border-radius: 15px; border-top-left-radius: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <strong>AI Tutor:</strong> Hello! I am your AI Study Tutor. What would you like to learn today?
            </div>
        </div>
    </div>

    <div class="chat-input-area" style="display: flex; gap: 10px;">
        <input type="text" id="chat-input" class="form-control" placeholder="Ask your doubt here..." style="flex-grow: 1;">
        <button id="send-btn" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Send</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-container');

    function addMessage(sender, text, isAi = false) {
        const msgDiv = document.createElement('div');
        msgDiv.style.marginBottom = '15px';
        msgDiv.style.textAlign = isAi ? 'left' : 'right';

        const bubble = document.createElement('div');
        bubble.style.display = 'inline-block';
        bubble.style.padding = '10px 15px';
        bubble.style.borderRadius = '15px';
        bubble.style.boxShadow = '0 2px 5px rgba(0,0,0,0.05)';
        bubble.style.maxWidth = '80%';

        if (isAi) {
            bubble.style.backgroundColor = 'var(--card-bg)';
            bubble.style.borderTopLeftRadius = '0';
        } else {
            bubble.style.backgroundColor = 'var(--primary-color)';
            bubble.style.color = 'white';
            bubble.style.borderTopRightRadius = '0';
        }

        const strong = document.createElement('strong');
        strong.textContent = sender + ': ';
        bubble.appendChild(strong);

        // Handle newlines safely
        const lines = text.split('\n');
        lines.forEach((line, index) => {
            if (index > 0) {
                bubble.appendChild(document.createElement('br'));
            }
            bubble.appendChild(document.createTextNode(line));
        });
        msgDiv.appendChild(bubble);
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        addMessage('You', text, false);
        chatInput.value = '';

        // Add loading indicator
        const loadingId = 'loading-' + Date.now();
        addMessage('AI Tutor', '<i class="fas fa-spinner fa-spin"></i> Thinking...', true);
        const loadingMsg = chatContainer.lastChild;
        loadingMsg.id = loadingId;

        try {
            const response = await fetch('/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();

            // Remove loading indicator
            document.getElementById(loadingId).remove();

            if (data.success) {
                // Convert simple markdown-like newlines to br
                addMessage('AI Tutor', data.reply, true);
            } else {
                addMessage('System', 'Error: ' + data.error, true);
            }
        } catch (e) {
            document.getElementById(loadingId).remove();
            addMessage('System', 'Failed to connect to the server.', true);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
});
</script>
{% endblock %}
