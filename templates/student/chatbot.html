{% extends 'student/base.html' %}

{% block title %}AI Study Tutor{% endblock %}
{% block page_title %}AI Study Tutor{% endblock %}

{% block content %}
<div class="glass-card" style="display: flex; flex-direction: column; height: 60vh; padding: 0;">
    <div style="padding: 15px 20px; border-bottom: 1px solid var(--border-color); background: rgba(255,255,255,0.3); border-radius: 12px 12px 0 0;">
        <h3 style="color: var(--text-primary); margin: 0;">
            <i class="fas fa-robot" style="color: var(--primary-color);"></i> Ask your doubts!
        </h3>
    </div>

    <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px;">
        <div class="chat-message ai-message" style="background: rgba(255,255,255,0.7); padding: 12px 16px; border-radius: 12px; align-self: flex-start; max-width: 80%; border: 1px solid var(--border-color);">
            Hello! I am your AI Study Tutor. How can I help you today?
        </div>
    </div>

    <div style="padding: 15px 20px; border-top: 1px solid var(--border-color); background: rgba(255,255,255,0.3); border-radius: 0 0 12px 12px;">
        <form id="chat-form" style="display: flex; gap: 10px;">
            <input type="text" id="chat-input" class="form-control" placeholder="Ask a question..." style="flex: 1; margin: 0;" required>
            <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
</div>

<script>
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (!message) return;

        // Add user message
        appendMessage('user', message);
        chatInput.value = '';

        // Add loading state
        const loadingId = 'loading-' + Date.now();
        appendMessage('ai', '<i class="fas fa-circle-notch fa-spin"></i> Thinking...', loadingId);

        try {
            const res = await fetch('/api/ai/doubt_solver', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question: message})
            });
            const data = await res.json();

            // Remove loading
            document.getElementById(loadingId).remove();

            if (data.success) {
                appendMessage('ai', data.answer);
            } else {
                appendMessage('ai', '<span style="color: red;">Error: ' + data.error + '</span>');
            }
        } catch (err) {
            document.getElementById(loadingId).remove();
            appendMessage('ai', '<span style="color: red;">Failed to connect to AI tutor.</span>');
        }

        // Scroll to bottom
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    function appendMessage(sender, text, id = null) {
        const msgDiv = document.createElement('div');
        if (id) msgDiv.id = id;
        msgDiv.style.padding = '12px 16px';
        msgDiv.style.borderRadius = '12px';
        msgDiv.style.maxWidth = '80%';
        msgDiv.style.whiteSpace = 'pre-wrap';

        if (sender === 'user') {
            msgDiv.style.background = 'var(--primary-color)';
            msgDiv.style.color = 'white';
            msgDiv.style.alignSelf = 'flex-end';
        } else {
            msgDiv.style.background = 'rgba(255,255,255,0.7)';
            msgDiv.style.border = '1px solid var(--border-color)';
            msgDiv.style.color = 'var(--text-primary)';
            msgDiv.style.alignSelf = 'flex-start';
        }

        msgDiv.innerHTML = text;
        chatMessages.appendChild(msgDiv);
    }
</script>
{% endblock %}
