{% extends "student/base.html" %}

{% block page_title %}AI Study Tools{% endblock %}

{% block content %}
<div class="card" style="margin-bottom: 20px;">
    <h2><i class="fas fa-magic" style="color: var(--primary-color);"></i> AI Doubt Solver</h2>
    <p>Stuck on a concept? Ask below!</p>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="text" id="doubt-input" placeholder="Type your doubt here..." class="form-control" style="flex:1;">
        <button onclick="askDoubt()" id="doubt-btn" class="btn btn-primary">Ask</button>
    </div>
    <div id="doubt-result" style="margin-top: 15px; display: none; background: #f8fafc; padding: 15px; border-radius: 8px; white-space: pre-wrap;"></div>
</div>

<div class="card" style="height: 500px; display: flex; flex-direction: column;">
    <h2><i class="fas fa-robot" style="color: #10b981;"></i> AI Study Chatbot</h2>
    <p>Your friendly AI tutor for study tips and concepts.</p>

    <div id="chat-window" style="flex: 1; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: #fafafa;">
        <div style="align-self: flex-start; background: #e0e7ff; padding: 10px 15px; border-radius: 15px; max-width: 80%;">
            Hello! I'm your study assistant. How can I help you today?
        </div>
    </div>

    <div style="display: flex; gap: 10px;">
        <input type="text" id="chat-input" placeholder="Type your message..." class="form-control" style="flex:1;" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" id="chat-btn" class="btn btn-success"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    async function askDoubt() {
        const question = document.getElementById('doubt-input').value;
        if(!question) return alert("Please enter your doubt.");

        document.getElementById('doubt-btn').disabled = true;
        document.getElementById('doubt-btn').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        try {
            const res = await fetch('/api/student/doubt_solver', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('doubt-result').innerText = data.answer;
                document.getElementById('doubt-result').style.display = 'block';
            } else {
                alert(data.error);
            }
        } catch(e) {
            alert("Error connecting to AI.");
        } finally {
            document.getElementById('doubt-btn').disabled = false;
            document.getElementById('doubt-btn').innerHTML = 'Ask';
        }
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value;
        if(!message) return;

        input.value = '';
        const chatWindow = document.getElementById('chat-window');

        // Add user message
        const userDiv = document.createElement('div');
        userDiv.style = "align-self: flex-end; background: #4f46e5; color: white; padding: 10px 15px; border-radius: 15px; max-width: 80%;";
        userDiv.innerText = message;
        chatWindow.appendChild(userDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        document.getElementById('chat-btn').disabled = true;

        try {
            const res = await fetch('/api/student/study_chatbot', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message})
            });
            const data = await res.json();

            const botDiv = document.createElement('div');
            botDiv.style = "align-self: flex-start; background: #e0e7ff; padding: 10px 15px; border-radius: 15px; max-width: 80%; white-space: pre-wrap;";
            if(data.success) {
                botDiv.innerText = data.reply;
            } else {
                botDiv.innerText = "Sorry, I couldn't process that.";
                botDiv.style.background = "#fee2e2";
            }
            chatWindow.appendChild(botDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

        } catch(e) {
            const botDiv = document.createElement('div');
            botDiv.style = "align-self: flex-start; background: #fee2e2; padding: 10px 15px; border-radius: 15px; max-width: 80%;";
            botDiv.innerText = "Error connecting to AI.";
            chatWindow.appendChild(botDiv);
        } finally {
            document.getElementById('chat-btn').disabled = false;
        }
    }
</script>
{% endblock %}
