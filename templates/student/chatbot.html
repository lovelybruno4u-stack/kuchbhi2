{% extends "student/base.html" %}
{% block title %}AI Chatbot{% endblock %}
{% block page_title %}AI Study Chatbot{% endblock %}
{% block content %}
<div class="glass-card d-flex flex-column" style="height: 70vh;">
    <div id="chat-history" class="flex-grow-1 p-3 mb-3 border rounded overflow-auto bg-light" style="flex: 1 1 auto; overflow-y: auto;">
        <div class="mb-3 text-secondary">
            <strong>AI Tutor:</strong> Hello! Ask me any concept doubt, exam prep question, or study tips!
        </div>
    </div>
    <div class="mt-auto d-flex gap-2">
        <input type="text" id="chat-input" class="form-control" placeholder="Type your question here..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" class="btn btn-primary" id="btn-send"><i class="fas fa-paper-plane"></i> Send</button>
    </div>
</div>

<script>
function addMessage(sender, text, isError=false) {
    const historyDiv = document.getElementById('chat-history');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'mb-3 ' + (sender === 'You' ? 'text-primary' : (isError ? 'text-danger' : 'text-secondary'));

    // Simple basic markdown support (newlines to br)
    const formattedText = text.replace(/\n/g, '<br>');

    msgDiv.innerHTML = `<strong>${sender}:</strong> <span style="white-space: pre-wrap;">${formattedText}</span>`;
    historyDiv.appendChild(msgDiv);
    historyDiv.scrollTop = historyDiv.scrollHeight;
}

function handleKeyPress(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
}

async function sendMessage() {
    const input = document.getElementById('chat-input');
    const btn = document.getElementById('btn-send');
    const question = input.value.trim();

    if(!question) return;

    input.value = '';
    addMessage('You', question);

    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    btn.disabled = true;
    input.disabled = true;

    try {
        const res = await fetch('/api/ai/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question})
        });
        const data = await res.json();

        if(data.success) {
            addMessage('AI Tutor', data.result);
        } else {
            addMessage('System', 'Error: ' + data.error, true);
        }
    } catch(e) {
        addMessage('System', 'Failed to connect to AI server', true);
    } finally {
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
        btn.disabled = false;
        input.disabled = false;
        input.focus();
    }
}
</script>
{% endblock %}
