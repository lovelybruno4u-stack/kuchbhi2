{% extends "base.html" %}

{% block title %}AI Study Chatbot{% endblock %}
{% block page_title %}AI Study Chatbot{% endblock %}

{% block content %}
<div class="glass-card" style="height: calc(100vh - 200px); display: flex; flex-direction: column;">
    <div id="chat-messages" class="chat-messages" style="flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-bottom: 1px solid #eee;">
        <div class="message ai">
            Hello! I'm your AI tutor. How can I help you study today?
        </div>
    </div>
    <div class="chat-input-area" style="padding: 15px; display: flex; gap: 10px;">
        <input type="text" id="chat-input" class="form-control" placeholder="Ask a question..." style="flex-grow: 1;">
        <button id="send-btn" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let messageHistory = [];

async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    // Add user message to UI
    const msgsDiv = document.getElementById('chat-messages');
    msgsDiv.innerHTML += `<div class="message user">${text}</div>`;
    input.value = '';
    msgsDiv.scrollTop = msgsDiv.scrollHeight;

    // Disable input
    input.disabled = true;
    document.getElementById('send-btn').disabled = true;

    // Add to history
    messageHistory.push({role: "user", content: text});

    try {
        const res = await fetch('/api/ai/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({messages: messageHistory})
        });
        const data = await res.json();

        if(data.success) {
            msgsDiv.innerHTML += `<div class="message ai">${data.answer.replace(/\n/g, '<br>')}</div>`;
            messageHistory.push({role: "assistant", content: data.answer});
        } else {
            msgsDiv.innerHTML += `<div class="message ai" style="color:red">Error: ${data.error}</div>`;
        }
    } catch(err) {
        msgsDiv.innerHTML += `<div class="message ai" style="color:red">Connection error.</div>`;
    }

    msgsDiv.scrollTop = msgsDiv.scrollHeight;
    input.disabled = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
}

document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('chat-input').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') sendMessage();
});
</script>
{% endblock %}
