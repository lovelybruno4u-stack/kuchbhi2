{% extends 'student/base.html' %}
{% block title %}AI Study Bot{% endblock %}
{% block page_title %}AI Study Bot{% endblock %}

{% block content %}
<div class="dashboard-grid" style="grid-template-columns: 1fr; gap: 2rem;">

    <!-- AI Study Chatbot -->
    <div class="card glass-card">
        <div class="card-header">
            <h3><i class="fas fa-comments"></i> Chat with AI Tutor</h3>
        </div>
        <div class="card-body">
            <div id="chat-window" style="height: 300px; overflow-y: auto; background: rgba(0,0,0,0.1); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
                <div class="chat-message ai-message" style="align-self: flex-start; background: rgba(99,102,241,0.2); padding: 0.5rem 1rem; border-radius: 8px;">
                    Hello! I'm your AI Study Tutor. Ask me any conceptual doubts, study tips, or exam prep questions.
                </div>
            </div>
            <form id="form-chat" class="modern-form" style="display: flex; gap: 0.5rem;">
                <input type="text" id="chat-input" class="form-control" placeholder="Type your message..." required style="flex: 1;">
                <button type="submit" class="btn btn-primary" id="btn-chat"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <!-- AI Doubt Solver -->
    <div class="card glass-card">
        <div class="card-header">
            <h3><i class="fas fa-lightbulb"></i> Doubt Solver</h3>
        </div>
        <div class="card-body">
            <form id="form-doubt-solver" class="modern-form">
                <div class="form-group">
                    <label>What's your doubt?</label>
                    <textarea id="doubt-question" class="form-control" rows="3" placeholder="Paste your question here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-doubt-solver">Solve Doubt</button>
            </form>
            <div id="res-doubt-solver" class="ai-response-box" style="display:none; margin-top: 1rem; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 8px; white-space: pre-wrap;"></div>
        </div>
    </div>

</div>
{% endblock %}
