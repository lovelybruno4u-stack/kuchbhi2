{% extends 'base.html' %}

{% block page_title %}My Attendance{% endblock %}

{% block content %}
<div class="grid grid-cols-2 gap-4 mb-4">
    <div class="glass-card" style="text-align: center;">
        <h3 class="text-secondary text-sm">Total Classes</h3>
        <p style="font-size: 2rem; font-weight: bold; color: var(--primary-color);" id="att-total">-</p>
    </div>
    <div class="glass-card" style="text-align: center;">
        <h3 class="text-secondary text-sm">Attendance %</h3>
        <p style="font-size: 2rem; font-weight: bold; color: var(--secondary-color);" id="att-perc">-</p>
    </div>
</div>

<div class="glass-card">
    <h3>Attendance History</h3>
    <div class="table-container">
        <table id="s-att-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated via JS -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    async function loadAttendance() {
        const res = await apiCall('/api/attendance');
        if (res && res.success) {
            const data = res.data.sort((a,b) => new Date(b.date) - new Date(a.date));

            let presentCount = 0;
            const tbody = document.querySelector('#s-att-table tbody');
            tbody.innerHTML = '';

            data.forEach(r => {
                if(r.status.toLowerCase() === 'present') presentCount++;
                const tr = document.createElement('tr');
                const badgeColor = r.status.toLowerCase() === 'present' ? 'var(--secondary-color)' : 'var(--danger)';
                tr.innerHTML = `
                    <td>${r.date}</td>
                    <td><span style="background: ${badgeColor}; color: white; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.8rem;">${r.status}</span></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('att-total').textContent = data.length;
            const perc = data.length > 0 ? Math.round((presentCount / data.length) * 100) : 0;
            document.getElementById('att-perc').textContent = perc + '%';
        }
    }
    document.addEventListener('DOMContentLoaded', loadAttendance);
</script>
{% endblock %}
