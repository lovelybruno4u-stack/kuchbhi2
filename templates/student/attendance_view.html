{% extends 'base.html' %}
{% block page_title %}My Attendance{% endblock %}
{% block content %}
<div class="panel glass">
    <div class="table-container">
        <table>
            <thead><tr><th>Date</th><th>Status</th></tr></thead>
            <tbody id="att-table"></tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    async function loadAtt() {
        const data = await apiCall('/api/attendance');
        if(data) {
            const tbody = document.getElementById('att-table');
            tbody.innerHTML = '';
            data.forEach(r => {
                const tr = document.createElement('tr');
                const color = r.status === 'Present' ? 'green' : 'red';
                tr.innerHTML = `
                    <td>${r.date}</td>
                    <td style="color: ${color}; font-weight: bold;">${r.status}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    }
    loadAtt();
</script>
{% endblock %}
