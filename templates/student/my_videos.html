{% extends 'base.html' %}
{% block page_title %}My Videos{% endblock %}
{% block content %}
<div class="panel glass">
    <div class="table-container">
        <table>
            <thead><tr><th>Date</th><th>Subject</th><th>Link</th></tr></thead>
            <tbody id="videos-table"></tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    async function loadVideos() {
        const data = await apiCall('/api/videos');
        if(data) {
            const tbody = document.getElementById('videos-table');
            tbody.innerHTML = '';
            data.forEach(v => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${v.date}</td>
                    <td>${v.subject}</td>
                    <td><a href="${v.drive_link}" target="_blank" class="btn btn-secondary btn-sm">Watch</a></td>
                `;
                tbody.appendChild(tr);
            });
        }
    }
    loadVideos();
</script>
{% endblock %}
