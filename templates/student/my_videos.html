{% extends 'base.html' %}

{% block page_title %}My Videos{% endblock %}

{% block content %}
<div class="glass-card mb-4">
    <h3>Today's Video</h3>
    <div id="today-video" class="mt-2 p-4" style="background: rgba(255,255,255,0.5); border-radius: var(--radius-md); text-align: center;">
        <span class="loader"></span>
    </div>
</div>

<div class="glass-card">
    <h3>Past Videos</h3>
    <div class="table-container">
        <table id="s-videos-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Subject</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated via JS -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    async function loadVideos() {
        const res = await apiCall('/api/videos');
        if (res && res.success) {
            const data = res.data.sort((a,b) => new Date(b.date) - new Date(a.date));
            const todayStr = new Date().toISOString().split('T')[0];

            const todayVidContainer = document.getElementById('today-video');
            const todayVids = data.filter(v => v.date === todayStr);

            if (todayVids.length > 0) {
                todayVidContainer.innerHTML = '';
                todayVids.forEach(v => {
                    todayVidContainer.innerHTML += `
                        <div class="mb-2">
                            <span style="font-weight: 500;">${escapeHTML(v.subject)}</span>
                            <a href="${escapeHTML(v.drive_link)}" target="_blank" class="btn btn-primary" style="margin-left: 1rem;"><i class="fas fa-play"></i> Watch Now</a>
                        </div>
                    `;
                });
            } else {
                todayVidContainer.innerHTML = '<p class="text-secondary">No videos posted for today yet.</p>';
            }

            const tbody = document.querySelector('#s-videos-table tbody');
            tbody.innerHTML = '';
            const pastVids = data.filter(v => v.date !== todayStr);
            pastVids.forEach(v => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHTML(v.date)}</td>
                    <td>${escapeHTML(v.subject)}</td>
                    <td><a href="${escapeHTML(v.drive_link)}" target="_blank" class="btn btn-secondary btn-sm"><i class="fas fa-external-link-alt"></i> View</a></td>
                `;
                tbody.appendChild(tr);
            });
        }
    }
    document.addEventListener('DOMContentLoaded', loadVideos);
</script>
{% endblock %}
