{% extends 'base.html' %}

{% block page_title %}Class Announcements{% endblock %}

{% block content %}
<div class="glass-card">
    <h3>All Announcements</h3>
    <div id="full-ann-list" class="mt-4 grid gap-4">
        <!-- Populated via JS -->
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const res = await apiCall('/api/announcements');
        if (res && res.success) {
            const list = document.getElementById('full-ann-list');
            if(res.data.length === 0) {
                list.innerHTML = '<p class="text-secondary">No announcements available.</p>';
            }
            res.data.forEach(a => {
                const div = document.createElement('div');
                div.style.cssText = "padding: 1.5rem; border-left: 4px solid var(--primary-color); background: rgba(255,255,255,0.7); border-radius: 0 var(--radius-md) var(--radius-md) 0; box-shadow: var(--shadow-sm);";
                div.innerHTML = `
                    <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;"><i class="fas fa-clock"></i> ${escapeHTML(a.date)}</div>
                    <div style="font-size: 1rem; line-height: 1.6; white-space: pre-wrap;">${escapeHTML(a.message)}</div>
                `;
                list.appendChild(div);
            });
        }
    });
</script>
{% endblock %}
