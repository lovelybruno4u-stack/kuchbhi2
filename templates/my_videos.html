{% extends "student_base.html" %}

{% block page_title %}My Class Videos{% endblock %}

{% block content %}
<div class="cards-grid">
    {% for video in videos|reverse %}
    <div class="card glass" style="padding: 0; overflow: hidden;">
        <div style="height: 140px; background: #E5E7EB; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 3rem;">
            <i class="fas fa-play-circle"></i>
        </div>
        <div style="padding: 1.5rem;">
            <div style="font-size: 0.8rem; color: var(--primary-color); font-weight: 600; margin-bottom: 0.5rem;">{{ video.subject }}</div>
            <div style="font-size: 0.9rem; font-weight: 500; margin-bottom: 1rem;">Class Recording - {{ video.date }}</div>
            <a href="{{ video.drive_link }}" target="_blank" class="btn btn-primary" style="width: 100%; justify-content: center; font-size: 0.9rem;">Watch Video</a>
        </div>
    </div>
    {% else %}
    <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--surface-solid); border-radius: var(--border-radius);">
        <i class="fas fa-video-slash" style="font-size: 3rem; color: var(--border-color); margin-bottom: 1rem;"></i>
        <p style="color: var(--text-muted);">No videos available yet.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
