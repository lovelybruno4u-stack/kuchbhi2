{% extends "base.html" %}

{% block title %}My Videos{% endblock %}

{% block content %}
<div class="flex-between mb-4">
    <h1>Class Videos</h1>
</div>

<div class="dashboard-grid" id="videos-container">
    <div style="grid-column: 1 / -1;" class="text-center text-muted">Loading videos...</div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    async function loadVideos() {
        try {
            const data = await apiCall('/api/videos');
            const container = document.getElementById('videos-container');
            container.innerHTML = '';

            if(data.length === 0) {
                container.innerHTML = '<div style="grid-column: 1 / -1;" class="glass-card text-center text-muted">No videos found.</div>';
                return;
            }

            data.forEach(v => {
                container.innerHTML += `
                    <div class="glass-card">
                        <h3>${v.subject}</h3>
                        <p class="text-muted"><i class="fa-regular fa-calendar"></i> ${v.date}</p>
                        <div class="mt-4">
                            <a href="${v.drive_link}" target="_blank" class="btn btn-primary w-100 text-center" style="display: block;"><i class="fa-solid fa-play"></i> Watch Now</a>
                        </div>
                    </div>
                `;
            });
        } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', loadVideos);
</script>
{% endblock %}
