{% extends "base.html" %}

{% block title %}My Video Classes{% endblock %}

{% block content %}
<div class="glass-card">
    <div class="dashboard-grid" id="studentVideosGrid">
        <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="loading-spinner" style="border-top-color: var(--primary-color);"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadStudentVideos() {
        const grid = document.getElementById('studentVideosGrid');
        const videos = await fetchData('/api/videos');

        if (!videos || videos.length === 0) {
            grid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;"><i class="fas fa-video-slash"></i><p>No video classes available yet.</p></div>';
            return;
        }

        // Sort descending by date
        videos.sort((a, b) => new Date(b.date) - new Date(a.date));

        grid.innerHTML = '';
        videos.forEach(v => {
            const card = document.createElement('div');
            card.className = 'glass-card';
            card.style.display = 'flex';
            card.style.flexDirection = 'column';
            card.style.background = '#fff';

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom: 1rem;">
                    <span style="font-size: 0.8rem; color: var(--text-secondary);"><i class="far fa-calendar"></i> ${formatDate(v.date)}</span>
                </div>
                <h3 style="margin-bottom: 1rem; color: var(--text-primary); font-size: 1.1rem;">${v.subject}</h3>
                <a href="${v.drive_link}" target="_blank" class="btn btn-primary" style="margin-top: auto; text-align: center;">
                    <i class="fas fa-play" style="margin-right: 0.5rem;"></i> Watch Class
                </a>
            `;
            grid.appendChild(card);
        });
    }

    loadStudentVideos();
</script>
{% endblock %}
