{% extends 'base.html' %}
{% block page_title %}My Class Videos{% endblock %}
{% block content %}

<div class="glass-panel" style="padding: 1.5rem; margin-bottom: 2rem;">
    <h3>AI Doubt Solver</h3>
    <p style="color: var(--text-secondary); margin-bottom: 1rem;">Have a doubt from a video? Ask our AI!</p>
    <div style="display: flex; gap: 1rem;">
        <input type="text" id="doubtInput" placeholder="Type your doubt here..." style="flex: 1;">
        <button class="btn btn-primary" onclick="solveDoubt()" id="solveBtn">Solve Doubt</button>
    </div>
    <div id="doubtOutput" class="ai-output-box hidden"></div>
</div>

<div class="dashboard-grid" id="videosGrid">
    <p>Loading videos...</p>
</div>

{% endblock %}
{% block extra_js %}
<script>
    async function loadVideos() {
        const res = await apiCall('/api/videos');
        const grid = document.getElementById('videosGrid');
        if(res.success) {
            if(res.data.length === 0) {
                grid.innerHTML = '<p>No videos available yet.</p>';
                return;
            }
            grid.innerHTML = res.data.map(v => `
                <div class="glass-panel" style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <h3 style="font-size: 1.125rem;">${v.subject}</h3>
                        <span style="font-size: 0.875rem; color: var(--text-secondary);">${v.date}</span>
                    </div>
                    <a href="${v.drive_link}" target="_blank" class="btn btn-secondary" style="margin-top: auto; justify-content: center;">Watch Video</a>
                </div>
            `).join('');
        }
    }

    async function solveDoubt() {
        const q = document.getElementById('doubtInput').value;
        if(!q) return;

        const btn = document.getElementById('solveBtn');
        const out = document.getElementById('doubtOutput');

        btn.innerText = 'Thinking...'; btn.disabled = true;

        const res = await apiCall('/api/ai/doubt-solver', 'POST', { question: q });

        out.classList.remove('hidden');
        out.innerText = res.success ? res.answer : 'Error: ' + res.error;

        btn.innerText = 'Solve Doubt'; btn.disabled = false;
    }

    loadVideos();
</script>
{% endblock %}
