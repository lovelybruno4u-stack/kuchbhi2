{% extends "teacher/base.html" %}
{% block title %}AI Tools{% endblock %}
{% block page_title %}AI Tools{% endblock %}
{% block content %}
<div class="glass-card mb-4">
    <h2><i class="fas fa-brain"></i> Quiz Generator</h2>
    <div class="form-group">
        <label>Subject</label>
        <input type="text" id="quiz-subject" class="form-control" placeholder="e.g. Physics">
    </div>
    <div class="form-group mt-3">
        <label>Topic</label>
        <input type="text" id="quiz-topic" class="form-control" placeholder="e.g. Newton's Laws">
    </div>
    <button onclick="generateQuiz()" class="btn btn-primary mt-3" id="btn-quiz">Generate 5 MCQs</button>
    <div id="quiz-result" class="mt-3 p-3 bg-light rounded" style="display:none; white-space: pre-wrap;"></div>
</div>

<div class="glass-card mb-4">
    <h2><i class="fas fa-chart-pie"></i> Attendance Analysis</h2>
    <p>Analyze current attendance data and provide insights.</p>
    <button onclick="analyzeAttendance()" class="btn btn-primary mt-3" id="btn-attendance">Analyze Attendance</button>
    <div id="attendance-result" class="mt-3 p-3 bg-light rounded" style="display:none; white-space: pre-wrap;"></div>
</div>

<div class="glass-card mb-4">
    <h2><i class="fas fa-video"></i> Video Summary Generator</h2>
    <div class="form-group">
        <label>Video Topic</label>
        <input type="text" id="video-topic" class="form-control" placeholder="e.g. Chemical Kinetics Lecture 1">
    </div>
    <button onclick="generateVideoSummary()" class="btn btn-primary mt-3" id="btn-video">Generate Summary Notes</button>
    <div id="video-result" class="mt-3 p-3 bg-light rounded" style="display:none; white-space: pre-wrap;"></div>
</div>

<div class="glass-card mb-4">
    <h2><i class="fas fa-bullhorn"></i> Announcement Writer</h2>
    <div class="form-group">
        <label>Context</label>
        <input type="text" id="announcement-context" class="form-control" placeholder="e.g. Holiday tomorrow due to heavy rain">
    </div>
    <button onclick="generateAnnouncement()" class="btn btn-primary mt-3" id="btn-announcement">Write Announcement</button>
    <div id="announcement-result" class="mt-3 p-3 bg-light rounded" style="display:none; white-space: pre-wrap;"></div>
</div>

<script>
async function generateQuiz() {
    const btn = document.getElementById('btn-quiz');
    const resultDiv = document.getElementById('quiz-result');
    const subject = document.getElementById('quiz-subject').value;
    const topic = document.getElementById('quiz-topic').value;

    if(!subject || !topic) return alert("Please enter subject and topic");

    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/ai/quiz', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({subject, topic})
        });
        const data = await res.json();
        resultDiv.style.display = 'block';
        if(data.success) {
            resultDiv.innerHTML = data.result;
        } else {
            resultDiv.innerHTML = `<span class="text-danger">Error: ${data.error}</span>`;
        }
    } catch(e) {
        resultDiv.innerHTML = `<span class="text-danger">Failed to connect to AI server</span>`;
    } finally {
        btn.innerHTML = 'Generate 5 MCQs';
        btn.disabled = false;
    }
}

async function analyzeAttendance() {
    const btn = document.getElementById('btn-attendance');
    const resultDiv = document.getElementById('attendance-result');

    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/ai/attendance', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'}
        });
        const data = await res.json();
        resultDiv.style.display = 'block';
        if(data.success) {
            resultDiv.innerHTML = data.result;
        } else {
            resultDiv.innerHTML = `<span class="text-danger">Error: ${data.error}</span>`;
        }
    } catch(e) {
        resultDiv.innerHTML = `<span class="text-danger">Failed to connect to AI server</span>`;
    } finally {
        btn.innerHTML = 'Analyze Attendance';
        btn.disabled = false;
    }
}

async function generateVideoSummary() {
    const btn = document.getElementById('btn-video');
    const resultDiv = document.getElementById('video-result');
    const topic = document.getElementById('video-topic').value;

    if(!topic) return alert("Please enter video topic");

    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/ai/video_summary', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({topic})
        });
        const data = await res.json();
        resultDiv.style.display = 'block';
        if(data.success) {
            resultDiv.innerHTML = data.result;
        } else {
            resultDiv.innerHTML = `<span class="text-danger">Error: ${data.error}</span>`;
        }
    } catch(e) {
        resultDiv.innerHTML = `<span class="text-danger">Failed to connect to AI server</span>`;
    } finally {
        btn.innerHTML = 'Generate Summary Notes';
        btn.disabled = false;
    }
}

async function generateAnnouncement() {
    const btn = document.getElementById('btn-announcement');
    const resultDiv = document.getElementById('announcement-result');
    const context = document.getElementById('announcement-context').value;

    if(!context) return alert("Please enter context");

    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Writing...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/ai/announcement', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({context})
        });
        const data = await res.json();
        resultDiv.style.display = 'block';
        if(data.success) {
            resultDiv.innerHTML = data.result;
        } else {
            resultDiv.innerHTML = `<span class="text-danger">Error: ${data.error}</span>`;
        }
    } catch(e) {
        resultDiv.innerHTML = `<span class="text-danger">Failed to connect to AI server</span>`;
    } finally {
        btn.innerHTML = 'Write Announcement';
        btn.disabled = false;
    }
}
</script>
{% endblock %}
