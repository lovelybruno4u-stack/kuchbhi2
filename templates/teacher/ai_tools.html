{% extends 'teacher/base.html' %}

{% block title %}AI Tools{% endblock %}
{% block page_title %}AI Tools{% endblock %}

{% block content %}
<div class="glass-card" style="margin-bottom: 24px;">
    <h3 style="color: var(--text-primary);"><i class="fas fa-robot" style="color: var(--primary-color);"></i> AI Utilities</h3>

    <div style="margin-top: 20px;">
        <h4 style="color: var(--text-primary);"><i class="fas fa-chart-line" style="color: var(--success);"></i> AI Attendance Analysis</h4>
        <button id="btn-analyze-attendance" class="btn btn-primary" style="margin-top: 10px;" onclick="analyzeAttendance()">Analyze Attendance</button>
        <div id="attendance-analysis-result" style="margin-top: 15px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; display: none;"></div>
    </div>

    <hr style="margin: 30px 0; border: none; border-top: 1px solid #e5e7eb;">

    <div>
        <h4 style="color: var(--text-primary);"><i class="fas fa-video" style="color: var(--warning);"></i> AI Video Summary</h4>
        <div style="display: flex; gap: 10px; margin-top: 10px; align-items: flex-start;">
            <input type="text" id="video-topic" class="form-control" placeholder="Enter Video Topic..." style="flex: 1;">
            <button id="btn-video-summary" class="btn btn-warning" onclick="generateVideoSummary()">Generate Summary</button>
        </div>
        <div id="video-summary-result" style="margin-top: 15px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; display: none;"></div>
    </div>

    <hr style="margin: 30px 0; border: none; border-top: 1px solid #e5e7eb;">

    <div>
        <h4 style="color: var(--text-primary);"><i class="fas fa-question-circle" style="color: var(--danger);"></i> AI Quiz Generator</h4>
        <div style="display: flex; gap: 10px; margin-top: 10px; align-items: flex-start;">
            <input type="text" id="quiz-topic" class="form-control" placeholder="Enter Subject and Topic..." style="flex: 1;">
            <button id="btn-quiz-generator" class="btn btn-danger" onclick="generateQuiz()">Generate Quiz</button>
        </div>
        <div id="quiz-generator-result" style="margin-top: 15px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; display: none;"></div>
    </div>
</div>

<script>
    async function analyzeAttendance() {
        const btn = document.getElementById('btn-analyze-attendance');
        const resultDiv = document.getElementById('attendance-analysis-result');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';

        try {
            const response = await fetch('/api/ai/attendance_analysis', { method: 'POST' });
            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `<p style="white-space: pre-wrap;">${data.analysis}</p>`;
                resultDiv.style.display = 'block';
                showToast('Analysis complete!');
            } else {
                showToast(data.error || 'Failed to analyze attendance.', 'error');
            }
        } catch (e) {
            showToast('Network error.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Analyze Attendance';
        }
    }

    async function generateVideoSummary() {
        const topicInput = document.getElementById('video-topic');
        const topic = topicInput.value.trim();
        if (!topic) {
            showToast('Please enter a video topic.', 'warning');
            return;
        }

        const btn = document.getElementById('btn-video-summary');
        const resultDiv = document.getElementById('video-summary-result');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';

        try {
            const response = await fetch('/api/ai/video_summary', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic: topic })
            });
            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `<p style="white-space: pre-wrap;">${data.summary}</p>`;
                resultDiv.style.display = 'block';
                showToast('Summary generated!');
            } else {
                showToast(data.error || 'Failed to generate summary.', 'error');
            }
        } catch (e) {
            showToast('Network error.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Generate Summary';
        }
    }

    async function generateQuiz() {
        const topicInput = document.getElementById('quiz-topic');
        const topic = topicInput.value.trim();
        if (!topic) {
            showToast('Please enter a subject and topic.', 'warning');
            return;
        }

        const btn = document.getElementById('btn-quiz-generator');
        const resultDiv = document.getElementById('quiz-generator-result');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';

        try {
            const response = await fetch('/api/ai/quiz_generator', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic: topic })
            });
            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `<p style="white-space: pre-wrap;">${data.quiz}</p>`;
                resultDiv.style.display = 'block';
                showToast('Quiz generated!');
            } else {
                showToast(data.error || 'Failed to generate quiz.', 'error');
            }
        } catch (e) {
            showToast('Network error.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Generate Quiz';
        }
    }
</script>
{% endblock %}
