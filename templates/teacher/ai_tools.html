{% extends "teacher/base.html" %}

{% block page_title %}AI Tools{% endblock %}

{% block content %}
<style>
    .ai-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }
    .ai-card {
        background: var(--white);
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        border: 1px solid #e5e7eb;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .ai-card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--primary-color);
        border-bottom: 2px solid #f3f4f6;
        padding-bottom: 10px;
    }
    .ai-card-header i {
        font-size: 1.5rem;
    }
    .ai-form-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .ai-form-group label {
        font-weight: 500;
        color: var(--text-secondary);
        font-size: 0.9rem;
    }
    .ai-input {
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.95rem;
        transition: border-color 0.3s;
    }
    .ai-input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    textarea.ai-input {
        resize: vertical;
        min-height: 80px;
    }
    .ai-btn {
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s, transform 0.1s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }
    .ai-btn:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
    }
    .ai-btn:active {
        transform: translateY(0);
    }
    .ai-result {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 15px;
        font-size: 0.95rem;
        color: var(--text-primary);
        white-space: pre-wrap;
        max-height: 200px;
        overflow-y: auto;
        display: none;
    }
    .spinner {
        display: inline-block;
        width: 1rem;
        height: 1rem;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>

<div class="ai-grid">
    <!-- Announcement Generator -->
    <div class="ai-card">
        <div class="ai-card-header">
            <i class="fas fa-bullhorn"></i> AI Announcement Generator
        </div>
        <div class="ai-form-group">
            <label for="announcement-topic">Topic / Details</label>
            <input type="text" id="announcement-topic" class="ai-input" placeholder="e.g., Holiday tomorrow due to heavy rain">
        </div>
        <button class="ai-btn" id="btn-announcement" onclick="generateAnnouncement()">
            <i class="fas fa-magic"></i> Generate Announcement
        </button>
        <div id="res-announcement" class="ai-result"></div>
    </div>

    <!-- Attendance Analysis -->
    <div class="ai-card">
        <div class="ai-card-header">
            <i class="fas fa-chart-pie"></i> AI Attendance Analysis
        </div>
        <p style="font-size: 0.9rem; color: var(--text-secondary);">Analyze the current attendance data to get insights on irregular students and overall trends.</p>
        <button class="ai-btn" id="btn-attendance" onclick="analyzeAttendance()">
            <i class="fas fa-chart-line"></i> Analyze Data
        </button>
        <div id="res-attendance" class="ai-result"></div>
    </div>

    <!-- Video Summary -->
    <div class="ai-card">
        <div class="ai-card-header">
            <i class="fas fa-video"></i> AI Video Summary
        </div>
        <div class="ai-form-group">
            <label for="video-topic">Video Topic / Content</label>
            <textarea id="video-topic" class="ai-input" placeholder="e.g., Newton's Laws of Motion"></textarea>
        </div>
        <button class="ai-btn" id="btn-video" onclick="summarizeVideo()">
            <i class="fas fa-file-alt"></i> Generate Summary Notes
        </button>
        <div id="res-video" class="ai-result"></div>
    </div>

    <!-- Quiz Generator -->
    <div class="ai-card">
        <div class="ai-card-header">
            <i class="fas fa-question-circle"></i> AI Quiz Generator
        </div>
        <div class="ai-form-group">
            <label for="quiz-topic">Subject and Topic</label>
            <input type="text" id="quiz-topic" class="ai-input" placeholder="e.g., Physics - Thermodynamics">
        </div>
        <button class="ai-btn" id="btn-quiz" onclick="generateQuiz()">
            <i class="fas fa-tasks"></i> Generate 5 MCQs
        </button>
        <div id="res-quiz" class="ai-result"></div>
    </div>
</div>

<script>
    async function makeApiCall(endpoint, payload, btnId, resId) {
        const btn = document.getElementById(btnId);
        const res = document.getElementById(resId);
        const originalText = btn.innerHTML;

        btn.innerHTML = '<span class="spinner"></span> Processing...';
        btn.disabled = true;
        res.style.display = 'none';
        res.innerText = '';

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            const data = await response.json();

            res.style.display = 'block';
            if (data.success) {
                res.innerText = data.result;
            } else {
                res.innerText = 'Error: ' + data.error;
                res.style.color = 'red';
            }
        } catch (err) {
            res.style.display = 'block';
            res.innerText = 'Network error: ' + err.message;
            res.style.color = 'red';
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    function generateAnnouncement() {
        const topic = document.getElementById('announcement-topic').value;
        if (!topic) return alert('Please enter a topic');
        makeApiCall('/api/teacher/generate_announcement', { topic: topic }, 'btn-announcement', 'res-announcement');
    }

    function analyzeAttendance() {
        makeApiCall('/api/teacher/analyze_attendance', {}, 'btn-attendance', 'res-attendance');
    }

    function summarizeVideo() {
        const topic = document.getElementById('video-topic').value;
        if (!topic) return alert('Please enter a video topic');
        makeApiCall('/api/teacher/summarize_video', { topic: topic }, 'btn-video', 'res-video');
    }

    function generateQuiz() {
        const topic = document.getElementById('quiz-topic').value;
        if (!topic) return alert('Please enter a subject/topic');
        makeApiCall('/api/teacher/generate_quiz', { topic: topic }, 'btn-quiz', 'res-quiz');
    }
</script>
{% endblock %}
