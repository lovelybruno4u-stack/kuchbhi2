{% extends 'base.html' %}

{% block page_title %}Announcements System{% endblock %}

{% block content %}
<div class="glass-card mb-4">
    <h3>Post Announcement</h3>
    <div class="mt-2 mb-4 p-4" style="background: rgba(79, 70, 229, 0.05); border-radius: var(--radius-md); border: 1px solid rgba(79, 70, 229, 0.2);">
        <h4 style="color: var(--primary-color); margin-bottom: 0.5rem;"><i class="fas fa-magic"></i> AI Generator</h4>
        <div class="flex gap-2">
            <input type="text" id="ai-prompt" class="form-control" placeholder="e.g., Write a professional coaching class announcement about holiday tomorrow">
            <button id="gen-btn" class="btn btn-secondary" style="white-space: nowrap;">Generate <i class="fas fa-sparkles"></i></button>
        </div>
    </div>

    <form id="ann-form">
        <div class="form-group">
            <label>Message Content</label>
            <textarea id="ann-msg" class="form-control" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Publish</button>
    </form>
</div>

<div class="glass-card">
    <h3>Recent Announcements</h3>
    <div id="ann-list" class="mt-2 grid gap-2">
        <!-- Populated via JS -->
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    async function loadAnnouncements() {
        const res = await apiCall('/api/announcements');
        if (res && res.success) {
            const list = document.getElementById('ann-list');
            list.innerHTML = '';
            res.data.forEach(a => {
                const div = document.createElement('div');
                div.style.cssText = "padding: 1rem; border: 1px solid rgba(0,0,0,0.1); border-radius: var(--radius-md); background: rgba(255,255,255,0.5);";
                div.innerHTML = `
                    <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;"><i class="fas fa-clock"></i> ${escapeHTML(a.date)}</div>
                    <div style="white-space: pre-wrap;">${escapeHTML(a.message)}</div>
                `;
                list.appendChild(div);
            });
        }
    }

    document.getElementById('gen-btn').addEventListener('click', async () => {
        const prompt = document.getElementById('ai-prompt').value;
        if(!prompt) return modal.show('Notice', 'Please enter a prompt for AI.');

        const btn = document.getElementById('gen-btn');
        btn.innerHTML = '<span class="loader" style="width: 16px; height: 16px; border-width: 2px;"></span>';
        btn.disabled = true;

        const res = await apiCall('/api/ai/announcement', 'POST', { prompt });
        if (res && res.success) {
            document.getElementById('ann-msg').value = res.announcement;
        } else {
            modal.show('Error', res?.error || 'AI generation failed', true);
        }

        btn.innerHTML = 'Generate <i class="fas fa-sparkles"></i>';
        btn.disabled = false;
    });

    document.getElementById('ann-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('ann-msg').value;
        const res = await apiCall('/api/announcements', 'POST', { message: msg });
        if (res && res.success) {
            document.getElementById('ann-msg').value = '';
            modal.show('Success', 'Announcement published.');
            loadAnnouncements();
        } else {
            modal.show('Error', 'Failed to publish', true);
        }
    });

    document.addEventListener('DOMContentLoaded', loadAnnouncements);
</script>
{% endblock %}
