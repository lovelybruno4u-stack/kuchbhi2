{% extends 'base.html' %}
{% block page_title %}Announcements{% endblock %}
{% block content %}
<div class="panel glass">
    <h2>Post Announcement</h2>
    <div style="display: flex; gap: 1rem; margin-top: 1rem;">
        <div style="flex: 2;">
            <textarea id="ann-msg" rows="5" style="width: 100%;"></textarea>
            <button class="btn" style="margin-top: 1rem;" onclick="postAnn()">Post Announcement</button>
        </div>
        <div class="glass" style="flex: 1; padding: 1rem; border-radius: 8px; background: #EEF2FF;">
            <h4>AI Generator</h4>
            <p style="font-size: 0.8rem; margin-bottom: 0.5rem; color: var(--text-muted);">Let AI draft a professional announcement.</p>
            <input type="text" id="ai-topic" placeholder="e.g. holiday tomorrow due to rain" style="width: 100%; margin-bottom: 0.5rem;">
            <button class="btn btn-secondary" style="width: 100%;" onclick="genAiAnn(this)">Generate with AI</button>
        </div>
    </div>
</div>
<div class="panel glass">
    <h2>History</h2>
    <div id="ann-list" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem;"></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    async function postAnn() {
        const msg = document.getElementById('ann-msg').value;
        if(!msg) return;
        const res = await apiCall('/api/announcements', 'POST', {message: msg});
        if(res && res.success) { document.getElementById('ann-msg').value=''; loadAnns(); }
    }
    async function loadAnns() {
        const data = await apiCall('/api/announcements');
        if(data) {
            const list = document.getElementById('ann-list');
            list.innerHTML='';
            data.reverse().forEach(a => {
                const div = document.createElement('div');
                div.className = 'glass';
                div.style.padding = '1rem';
                div.innerHTML = `<small style="color:var(--primary); font-weight:bold;">${a.date}</small><p style="margin-top:0.5rem; white-space:pre-wrap;">${a.message}</p>`;
                list.appendChild(div);
            });
        }
    }
    async function genAiAnn(btn) {
        const topic = document.getElementById('ai-topic').value;
        if(!topic) return;
        const origText = btn.textContent;
        btn.textContent = 'Generating...';
        btn.disabled = true;
        const res = await apiCall('/api/ai/announce', 'POST', {topic});
        if(res && res.announcement) { document.getElementById('ann-msg').value = res.announcement; }
        btn.textContent = origText;
        btn.disabled = false;
    }
    loadAnns();
</script>
{% endblock %}
