{% extends 'base.html' %}

{% block page_title %}Dashboard{% endblock %}

{% block content %}
<div class="dashboard-grid">
    <div class="stat-card glass">
        <h3>Total Students</h3>
        <div class="value" id="stat-students">--</div>
    </div>
    <div class="stat-card glass">
        <h3>Today's Attendance</h3>
        <div class="value" id="stat-attendance">--</div>
    </div>
    <div class="stat-card glass" style="grid-column: span 2;">
        <h3>Recent Activity</h3>
        <ul id="stat-recent" style="margin-top: 0.5rem; padding-left: 1rem; color: var(--text-muted); font-size: 0.9rem;">
            <li>No recent activity</li>
        </ul>
    </div>
</div>

<div class="panel glass">
    <h2>Quick Actions</h2>
    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
        <a href="{{ url_for('teacher_students') }}" class="btn"><i class="fas fa-user-plus"></i> Add Student</a>
        <a href="{{ url_for('teacher_attendance') }}" class="btn"><i class="fas fa-check-circle"></i> Mark Attendance</a>
        <a href="{{ url_for('teacher_videos') }}" class="btn"><i class="fas fa-video"></i> Post Video</a>
        <a href="{{ url_for('teacher_announcements') }}" class="btn"><i class="fas fa-bullhorn"></i> New Announcement</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadStats() {
        const stats = await apiCall('/api/stats');
        if (stats) {
            document.getElementById('stat-students').textContent = stats.total_students;
            document.getElementById('stat-attendance').textContent = stats.today_attendance;
            if (stats.recent_activity && stats.recent_activity.length > 0) {
                const ul = document.getElementById('stat-recent');
                ul.innerHTML = '';
                stats.recent_activity.forEach(act => {
                    const li = document.createElement('li');
                    li.textContent = act;
                    ul.appendChild(li);
                });
            }
        }
    }
    loadStats();
</script>
{% endblock %}
