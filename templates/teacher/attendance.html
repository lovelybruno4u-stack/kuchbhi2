{% extends 'base.html' %}

{% block page_title %}Attendance{% endblock %}

{% block content %}
<div class="panel glass">
    <div style="display: flex; gap: 1rem; align-items: flex-end; margin-bottom: 1.5rem;">
        <div class="form-group" style="margin-bottom: 0;">
            <label>Date</label>
            <input type="date" id="att-date" value="">
        </div>
        <button class="btn" onclick="loadAttendance()">Load Students</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="attendance-table"></tbody>
        </table>
    </div>
    <div style="margin-top: 1rem; display: flex; justify-content: flex-end;">
        <button class="btn" onclick="saveAttendance()">Save Attendance</button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('att-date').valueAsDate = new Date();
    let currentStudents = [];

    async function loadAttendance() {
        const date = document.getElementById('att-date').value;
        const students = await apiCall('/api/students');
        const existing = await apiCall(`/api/attendance?date=${date}`);

        if (students) {
            currentStudents = students;
            const existingMap = {};
            if(existing) {
                existing.forEach(r => existingMap[r.student_id] = r.status);
            }

            const tbody = document.getElementById('attendance-table');
            tbody.innerHTML = '';
            students.forEach(s => {
                const status = existingMap[s.id] || 'Present';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${s.roll}</td>
                    <td>${s.name}</td>
                    <td>
                        <select id="status-${s.id}">
                            <option value="Present" ${status==='Present'?'selected':''}>Present</option>
                            <option value="Absent" ${status==='Absent'?'selected':''}>Absent</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    }

    async function saveAttendance() {
        const date = document.getElementById('att-date').value;
        const records = currentStudents.map(s => ({
            student_id: s.id,
            status: document.getElementById(`status-${s.id}`).value
        }));

        const res = await apiCall('/api/attendance', 'POST', { date, records });
        if(res && res.success) {
            showMessage('Success', 'Attendance saved successfully.');
        }
    }

    loadAttendance();
</script>
{% endblock %}
