{% extends 'base.html' %}

{% block page_title %}Attendance System{% endblock %}

{% block content %}
<div class="glass-card mb-4">
    <h3>Mark Daily Attendance</h3>
    <div class="flex gap-2 mt-2 items-center mb-4">
        <label for="att-date" style="font-weight: 500;">Select Date:</label>
        <input type="date" id="att-date" class="form-control" style="width: auto;">
        <button id="load-att-btn" class="btn btn-secondary">Load Students</button>
    </div>

    <div class="table-container" id="att-table-container" style="display: none;">
        <table id="attendance-table">
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated via JS -->
            </tbody>
        </table>
        <div class="mt-4 flex justify-end">
            <button id="save-att-btn" class="btn btn-primary"><i class="fas fa-save"></i> Save Attendance</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    let currentStudents = [];

    // Set today's date
    document.getElementById('att-date').valueAsDate = new Date();

    document.getElementById('load-att-btn').addEventListener('click', async () => {
        const res = await apiCall('/api/students');
        if (res && res.success) {
            currentStudents = res.data;
            const tbody = document.querySelector('#attendance-table tbody');
            tbody.innerHTML = '';

            // Note: In a real app we'd fetch existing attendance for the date and pre-fill.
            currentStudents.forEach(s => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHTML(s.roll)}</td>
                    <td>${escapeHTML(s.name)}</td>
                    <td>${escapeHTML(s.class)}</td>
                    <td>
                        <select class="form-control att-status" data-sid="${s.id}">
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('att-table-container').style.display = 'block';
        }
    });

    document.getElementById('save-att-btn').addEventListener('click', async () => {
        const date = document.getElementById('att-date').value;
        const selects = document.querySelectorAll('.att-status');
        const records = [];

        selects.forEach(sel => {
            records.push({
                student_id: sel.getAttribute('data-sid'),
                status: sel.value
            });
        });

        const res = await apiCall('/api/attendance', 'POST', { date, records });
        if (res && res.success) {
            modal.show('Success', 'Attendance saved to Google Sheets successfully.');
        } else {
            modal.show('Error', res.message || 'Failed to save attendance', true);
        }
    });
</script>
{% endblock %}
