{% extends 'base.html' %}

{% block page_title %}Daily Class Video System{% endblock %}

{% block content %}
<div class="glass-card mb-4">
    <h3>Add New Video</h3>
    <form id="add-video-form" class="grid grid-cols-3 gap-2 mt-2">
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="v-date" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Subject</label>
            <input type="text" id="v-subject" class="form-control" required placeholder="e.g. Mathematics">
        </div>
        <div class="form-group" style="grid-column: span 3;">
            <label>Google Drive Link</label>
            <input type="url" id="v-link" class="form-control" required placeholder="https://drive.google.com/...">
        </div>
        <div class="form-group" style="grid-column: span 3;">
            <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Add Video</button>
        </div>
    </form>
</div>

<div class="glass-card">
    <h3>Past Videos</h3>
    <div class="table-container">
        <table id="videos-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Subject</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated via JS -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    document.getElementById('v-date').valueAsDate = new Date();

    async function loadVideos() {
        const res = await apiCall('/api/videos');
        if (res && res.success) {
            const tbody = document.querySelector('#videos-table tbody');
            tbody.innerHTML = '';
            // Sort by date descending
            const data = res.data.sort((a,b) => new Date(b.date) - new Date(a.date));
            data.forEach(v => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHTML(v.date)}</td>
                    <td>${escapeHTML(v.subject)}</td>
                    <td><a href="${escapeHTML(v.drive_link)}" target="_blank" class="btn btn-secondary btn-sm" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;">View <i class="fas fa-external-link-alt"></i></a></td>
                `;
                tbody.appendChild(tr);
            });
        }
    }

    document.getElementById('add-video-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            date: document.getElementById('v-date').value,
            subject: document.getElementById('v-subject').value,
            drive_link: document.getElementById('v-link').value
        };
        const res = await apiCall('/api/videos', 'POST', data);
        if (res && res.success) {
            modal.show('Success', 'Video link saved successfully');
            document.getElementById('v-subject').value = '';
            document.getElementById('v-link').value = '';
            loadVideos();
        } else {
            modal.show('Error', 'Failed to save video', true);
        }
    });

    document.addEventListener('DOMContentLoaded', loadVideos);
</script>
{% endblock %}
