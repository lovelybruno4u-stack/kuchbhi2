{% extends 'base.html' %}

{% block page_title %}Videos{% endblock %}

{% block content %}
<div class="panel glass">
    <h2>Post New Video</h2>
    <form id="video-form" style="max-width: 500px; margin-top: 1rem;">
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="vid-date" required>
        </div>
        <div class="form-group">
            <label>Subject / Topic</label>
            <input type="text" id="vid-subject" required>
        </div>
        <div class="form-group">
            <label>Google Drive Video Link</label>
            <input type="url" id="vid-link" required>
        </div>
        <button type="submit" class="btn">Post Video</button>
    </form>
</div>

<div class="panel glass">
    <h2>Past Videos</h2>
    <div class="table-container" style="margin-top: 1rem;">
        <table>
            <thead><tr><th>Date</th><th>Subject</th><th>Link</th></tr></thead>
            <tbody id="videos-table"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('vid-date').valueAsDate = new Date();

    document.getElementById('video-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            date: document.getElementById('vid-date').value,
            subject: document.getElementById('vid-subject').value,
            drive_link: document.getElementById('vid-link').value
        };
        const res = await apiCall('/api/videos', 'POST', payload);
        if(res && res.success) {
            e.target.reset();
            document.getElementById('vid-date').valueAsDate = new Date();
            loadVideos();
            showMessage('Success', 'Video posted.');
        }
    });

    async function loadVideos() {
        const data = await apiCall('/api/videos');
        if(data) {
            const tbody = document.getElementById('videos-table');
            tbody.innerHTML = '';
            data.forEach(v => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${v.date}</td>
                    <td>${v.subject}</td>
                    <td><a href="${v.drive_link}" target="_blank" class="btn btn-secondary btn-sm">Watch</a></td>
                `;
                tbody.appendChild(tr);
            });
        }
    }
    loadVideos();
</script>
{% endblock %}
