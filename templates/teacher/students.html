{% extends 'base.html' %}

{% block page_title %}Student Management
<div id="edit-student-modal" class="modal-overlay hidden">
    <div class="modal-content glass-card" style="max-width: 500px; width: 90%;">
        <h3>Edit Student</h3>
        <form id="edit-student-form" class="grid grid-cols-2 gap-2 mt-2 text-left">
            <input type="hidden" id="e-id">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="e-name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Class</label>
                <input type="text" id="e-class" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" id="e-roll" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="e-phone" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="e-email" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Parent Name</label>
                <input type="text" id="e-parent" class="form-control" required>
            </div>
            <div class="form-group flex justify-between mt-4" style="grid-column: span 2;">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('edit-student-modal').classList.add('hidden')">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block content %}
<div class="glass-card mb-4">
    <h3>Add New Student</h3>
    <form id="add-student-form" class="grid grid-cols-3 gap-2 mt-2">
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="s-name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Class</label>
            <input type="text" id="s-class" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Roll Number</label>
            <input type="text" id="s-roll" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" id="s-phone" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="s-email" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Parent Name</label>
            <input type="text" id="s-parent" class="form-control" required>
        </div>
        <div class="form-group" style="grid-column: span 3;">
            <button type="submit" class="btn btn-primary">Add Student</button>
        </div>
    </form>
</div>

<div class="glass-card">
    <div class="flex justify-between items-center mb-2">
        <h3>Student List</h3>
        <input type="text" id="search-student" class="form-control" style="width: 250px;" placeholder="Search student...">
    </div>
    <div class="table-container">
        <table id="students-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Roll No</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Parent</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated via JS -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    let allStudents = [];

    async function loadStudents() {
        const res = await apiCall('/api/students');
        if (res && res.success) {
            allStudents = res.data;
            renderStudents(allStudents);
        }
    }

    function renderStudents(data) {
        const tbody = document.querySelector('#students-table tbody');
        tbody.innerHTML = '';
        data.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escapeHTML(s.name)}</td>
                <td>${escapeHTML(s.class)}</td>
                <td>${escapeHTML(s.roll)}</td>
                <td>${escapeHTML(s.phone)}</td>
                <td>${escapeHTML(s.email)}</td>
                <td>${escapeHTML(s.parent)}</td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')"><i class="fas fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('add-student-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('s-name').value,
            class: document.getElementById('s-class').value,
            roll: document.getElementById('s-roll').value,
            phone: document.getElementById('s-phone').value,
            email: document.getElementById('s-email').value,
            parent: document.getElementById('s-parent').value
        };
        const res = await apiCall('/api/students', 'POST', data);
        if (res && res.success) {
            modal.show('Success', 'Student added successfully');
            e.target.reset();
            loadStudents();
        } else {
            modal.show('Error', res.message || 'Failed to add student', true);
        }
    });

    document.getElementById('search-student').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        const filtered = allStudents.filter(s =>
            s.name.toLowerCase().includes(q) ||
            s.roll.toString().includes(q) ||
            s.class.toLowerCase().includes(q)
        );
        renderStudents(filtered);
    });

    async function deleteStudent(id) {
        if(confirm("Are you sure? Note: Native confirm used minimally, custom modal for alerts.")) {
            const res = await apiCall(`/api/students/${id}`, 'DELETE');
            if(res && res.success) {
                loadStudents();
            } else {
                modal.show('Error', 'Failed to delete', true);
            }
        }
    }


    function openEditStudent(id) {
        const s = allStudents.find(x => x.id === id);
        if(!s) return;
        document.getElementById('e-id').value = s.id;
        document.getElementById('e-name').value = s.name;
        document.getElementById('e-class').value = s.class;
        document.getElementById('e-roll').value = s.roll;
        document.getElementById('e-phone').value = s.phone;
        document.getElementById('e-email').value = s.email;
        document.getElementById('e-parent').value = s.parent;
        document.getElementById('edit-student-modal').classList.remove('hidden');
    }

    document.getElementById('edit-student-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('e-id').value;
        const data = {
            name: document.getElementById('e-name').value,
            class: document.getElementById('e-class').value,
            roll: document.getElementById('e-roll').value,
            phone: document.getElementById('e-phone').value,
            email: document.getElementById('e-email').value,
            parent: document.getElementById('e-parent').value
        };
        const res = await apiCall(`/api/students/${id}`, 'PUT', data);
        if (res && res.success) {
            document.getElementById('edit-student-modal').classList.add('hidden');
            modal.show('Success', 'Student updated successfully');
            loadStudents();
        } else {
            modal.show('Error', res.message || 'Failed to update student', true);
        }
    });

    document.addEventListener('DOMContentLoaded', loadStudents);
</script>
{% endblock %}
