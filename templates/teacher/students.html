{% extends 'base.html' %}

{% block page_title %}Student Management
<div id="edit-student-modal" class="modal-overlay">
    <div class="modal-content glass">
        <div class="modal-header">
            <h2>Edit Student</h2>
            <button class="close-btn" onclick="this.closest('.modal-overlay').classList.remove('active')">&times;</button>
        </div>
        <form id="edit-student-form">
            <input type="hidden" id="edit-stu-id">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="edit-stu-name" required>
            </div>
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Class</label>
                    <input type="text" id="edit-stu-class" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Roll Number</label>
                    <input type="text" id="edit-stu-roll" required>
                </div>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="edit-stu-phone" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="edit-stu-email">
            </div>
            <div class="form-group">
                <label>Parent Name</label>
                <input type="text" id="edit-stu-parent">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Update</button>
        </form>
    </div>
</div>

{% endblock %}

{% block content %}
<div class="panel glass">
    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
        <input type="text" id="search-student" placeholder="Search by name or roll..." style="width: 300px;">
        <button class="btn" onclick="document.getElementById('add-student-modal').classList.add('active')">
            <i class="fas fa-plus"></i> Add Student
        </button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Roll No</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Parent</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="students-table"></tbody>
        </table>
    </div>
</div>

<div id="add-student-modal" class="modal-overlay">
    <div class="modal-content glass">
        <div class="modal-header">
            <h2>Add Student</h2>
            <button class="close-btn" onclick="this.closest('.modal-overlay').classList.remove('active')">&times;</button>
        </div>
        <form id="add-student-form">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="stu-name" required>
            </div>
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Class</label>
                    <input type="text" id="stu-class" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Roll Number</label>
                    <input type="text" id="stu-roll" required>
                </div>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="stu-phone" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="stu-email">
            </div>
            <div class="form-group">
                <label>Parent Name</label>
                <input type="text" id="stu-parent">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Save</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let allStudents = [];

    async function loadStudents() {
        const data = await apiCall('/api/students');
        if (data) {
            allStudents = data;
            renderTable(data);
        }
    }

    function renderTable(students) {
        const tbody = document.getElementById('students-table');
        tbody.innerHTML = '';
        students.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${s.name}</td>
                <td>${s.class}</td>
                <td>${s.roll}</td>
                <td>${s.phone}</td>
                <td>${s.email}</td>
                <td>${s.parent}</td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="openEditModal('${s.id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')"><i class="fas fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('search-student').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allStudents.filter(s =>
            s.name.toLowerCase().includes(query) ||
            String(s.roll).toLowerCase().includes(query)
        );
        renderTable(filtered);
    });

    document.getElementById('add-student-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            name: document.getElementById('stu-name').value,
            class: document.getElementById('stu-class').value,
            roll: document.getElementById('stu-roll').value,
            phone: document.getElementById('stu-phone').value,
            email: document.getElementById('stu-email').value,
            parent: document.getElementById('stu-parent').value
        };
        const res = await apiCall('/api/students', 'POST', payload);
        if (res && res.success) {
            document.getElementById('add-student-modal').classList.remove('active');
            e.target.reset();
            loadStudents();
            showMessage('Success', 'Student added successfully.');
        }
    });

    async function deleteStudent(id) {
        if(confirm('Are you sure you want to delete this student?')) {
            const res = await apiCall(`/api/students/${id}`, 'DELETE');
            if(res && res.success) loadStudents();
        }
    }


    function openEditModal(id) {
        const s = allStudents.find(x => x.id === id);
        if(!s) return;
        document.getElementById('edit-stu-id').value = s.id;
        document.getElementById('edit-stu-name').value = s.name;
        document.getElementById('edit-stu-class').value = s.class;
        document.getElementById('edit-stu-roll').value = s.roll;
        document.getElementById('edit-stu-phone').value = s.phone;
        document.getElementById('edit-stu-email').value = s.email;
        document.getElementById('edit-stu-parent').value = s.parent;
        document.getElementById('edit-student-modal').classList.add('active');
    }

    document.getElementById('edit-student-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('edit-stu-id').value;
        const payload = {
            name: document.getElementById('edit-stu-name').value,
            class: document.getElementById('edit-stu-class').value,
            roll: document.getElementById('edit-stu-roll').value,
            phone: document.getElementById('edit-stu-phone').value,
            email: document.getElementById('edit-stu-email').value,
            parent: document.getElementById('edit-stu-parent').value
        };
        const res = await apiCall(`/api/students/${id}`, 'PUT', payload);
        if (res && res.success) {
            document.getElementById('edit-student-modal').classList.remove('active');
            loadStudents();
            showMessage('Success', 'Student updated successfully.');
        }
    });

    loadStudents();
</script>
{% endblock %}
