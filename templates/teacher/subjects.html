{% extends 'base.html' %}

{% block page_title %}Subjects{% endblock %}

{% block content %}
<div class="panel glass">
    <form id="subject-form" style="display: flex; gap: 1rem; align-items: flex-end; margin-bottom: 2rem;">
        <div class="form-group" style="margin-bottom: 0; flex: 1;">
            <label>Add New Subject</label>
            <input type="text" id="sub-name" required>
        </div>
        <button type="submit" class="btn">Add</button>
    </form>

    <div class="table-container">
        <table>
            <thead><tr><th>Subject Name</th><th>Action</th></tr></thead>
            <tbody id="subjects-table"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('subject-form').addEventListener('submit', async(e)=>{
        e.preventDefault();
        const res = await apiCall('/api/subjects', 'POST', {subject_name: document.getElementById('sub-name').value});
        if(res && res.success) { document.getElementById('sub-name').value=''; loadSubjects(); }
    });
    async function loadSubjects() {
        const data = await apiCall('/api/subjects');
        if(data) {
            const tbody = document.getElementById('subjects-table');
            tbody.innerHTML='';
            data.forEach(s => {
                const tr = document.createElement('tr');
                tr.innerHTML=`<td>${s.subject_name}</td><td>
    <button class="btn btn-secondary btn-sm" onclick="editSub('${s.subject_name}')"><i class="fas fa-edit"></i></button>
    <button class="btn btn-danger btn-sm" onclick="delSub('${s.subject_name}')"><i class="fas fa-trash"></i></button>
</td>`;
                tbody.appendChild(tr);
            });
        }
    }
    async function delSub(name) {
        if(confirm('Delete?')){
            const res = await apiCall(`/api/subjects?subject_name=${encodeURIComponent(name)}`, 'DELETE');
            if(res && res.success) loadSubjects();
        }
    }

    async function editSub(oldName) {
        const newName = prompt('Enter new subject name:', oldName);
        if(newName && newName !== oldName) {
            const res = await apiCall('/api/subjects', 'PUT', {old_name: oldName, new_name: newName});
            if(res && res.success) loadSubjects();
        }
    }

    loadSubjects();
</script>
{% endblock %}
