{% extends "base.html" %}

{% block title %}Announcements{% endblock %}

{% block header_actions %}
<button class="btn btn-primary" onclick="showModal('addAnnouncementModal')">
    <i class="fas fa-plus"></i> New Announcement
</button>
{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 800px; margin: 0 auto;">
    <div id="announcementsList" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="empty-state"><div class="loading-spinner" style="border-top-color: var(--primary-color);"></div></div>
    </div>
</div>

<!-- Add Announcement Modal -->
<div class="modal-overlay" id="addAnnouncementModal">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h2>Post Announcement</h2>
            <button class="modal-close" onclick="hideModal('addAnnouncementModal')">&times;</button>
        </div>
        <form id="addAnnouncementForm" onsubmit="handleAddAnnouncement(event)">
            <div class="form-group" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                <input type="text" id="ai_topic" class="form-control" placeholder="Topic for AI (e.g. Holiday tomorrow)">
                <button type="button" class="btn btn-secondary" onclick="generateAIAnnouncement()" id="aiGenBtn" style="white-space: nowrap;">
                    <i class="fas fa-magic"></i> Generate with AI
                </button>
            </div>

            <div class="form-group">
                <label class="form-label">Message</label>
                <textarea id="a_message" class="form-control" rows="6" required></textarea>
            </div>
            <div style="margin-top: 1.5rem; text-align: right;">
                <button type="button" class="btn btn-secondary" onclick="hideModal('addAnnouncementModal')" style="margin-right: 0.5rem;">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveAnnouncementBtn">Post</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadAnnouncements() {
        const list = document.getElementById('announcementsList');
        const anns = await fetchData('/api/announcements');

        if (!anns || anns.length === 0) {
            list.innerHTML = '<div class="empty-state"><i class="fas fa-bullhorn"></i><p>No announcements yet.</p></div>';
            return;
        }

        anns.sort((a, b) => new Date(b.date) - new Date(a.date));

        list.innerHTML = '';
        anns.forEach(a => {
            const div = document.createElement('div');
            div.style.padding = '1.5rem';
            div.style.border = '1px solid var(--border-color)';
            div.style.borderRadius = 'var(--radius-md)';
            div.style.background = '#fff';

            div.innerHTML = `
                <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                    <i class="far fa-clock"></i> ${formatDate(a.date)}
                </div>
                <div style="white-space: pre-wrap; color: var(--text-primary); line-height: 1.5;">${a.message}</div>
            `;
            list.appendChild(div);
        });
    }

    async function handleAddAnnouncement(e) {
        e.preventDefault();
        const btn = document.getElementById('saveAnnouncementBtn');
        btn.disabled = true;

        const data = {
            message: document.getElementById('a_message').value
        };

        const res = await postData('/api/announcements', data);
        if (res.success) {
            showToast('Announcement posted!');
            hideModal('addAnnouncementModal');
            document.getElementById('addAnnouncementForm').reset();
            loadAnnouncements();
        } else {
            showToast(res.error || 'Failed to post', 'error');
        }

        btn.disabled = false;
    }

    async function generateAIAnnouncement() {
        const topic = document.getElementById('ai_topic').value;
        if (!topic) {
            showToast('Please enter a topic for the AI', 'error');
            return;
        }

        const btn = document.getElementById('aiGenBtn');
        const origText = btn.innerHTML;
        btn.innerHTML = '<div class="loading-spinner"></div>';
        btn.disabled = true;

        const res = await postData('/api/ai/announcement', { topic: topic });

        if (res.announcement) {
            document.getElementById('a_message').value = res.announcement;
            showToast('Generated successfully!');
        } else {
            showToast('Failed to generate', 'error');
        }

        btn.innerHTML = origText;
        btn.disabled = false;
    }

    loadAnnouncements();
</script>
{% endblock %}
