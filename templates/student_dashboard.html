{% extends 'base.html' %}
{% block page_title %}Student Dashboard{% endblock %}
{% block content %}

<div class="glass-panel" style="padding: 2rem; margin-bottom: 2rem; background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%); color: white;">
    <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome back, {{ session.get('name') }}! 👋</h2>
    <p style="opacity: 0.9;">Ready to learn something new today?</p>
</div>

<div class="dashboard-grid">
    <a href="/student/chatbot" style="text-decoration: none; color: inherit;">
        <div class="glass-panel stat-card" style="transition: transform 0.2s;">
            <div class="stat-icon" style="background: #E0E7FF;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
            <div class="stat-details">
                <h3>Need Help?</h3>
                <p style="font-size: 1.25rem;">Ask AI Tutor</p>
            </div>
        </div>
    </a>

    <a href="/student/my-videos" style="text-decoration: none; color: inherit;">
        <div class="glass-panel stat-card" style="transition: transform 0.2s;">
            <div class="stat-icon" style="background: #D1FAE5; color: #059669;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></div>
            <div class="stat-details">
                <h3>Watch Classes</h3>
                <p style="font-size: 1.25rem;">My Videos</p>
            </div>
        </div>
    </a>

    <a href="/student/announcements" style="text-decoration: none; color: inherit;">
        <div class="glass-panel stat-card" style="transition: transform 0.2s;">
            <div class="stat-icon" style="background: #FEF3C7; color: #D97706;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
            <div class="stat-details">
                <h3>Updates</h3>
                <p style="font-size: 1.25rem;">Announcements</p>
            </div>
        </div>
    </a>
</div>

{% endblock %}
