{% extends 'base.html' %}
{% block content %}
<div class="top-header">
    <h1>Welcome, {{ session.get('name', 'Student') }}</h1>
</div>

<div class="dashboard-grid">
    <div class="card">
        <h3>Class</h3>
        <h2 style="font-size: 2rem; color: var(--primary-color); margin-top: 10px;">{{ student_class }}</h2>
    </div>
    <div class="card">
        <h3>Roll Number</h3>
        <h2 style="font-size: 2rem; color: var(--primary-color); margin-top: 10px;">{{ student_roll }}</h2>
    </div>
    <div class="card">
        <h3>Quick Links</h3>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
            <a href="{{ url_for('my_videos') }}" class="btn btn-primary" style="text-align: center; text-decoration: none;">Today's Video</a>
            <a href="{{ url_for('chatbot') }}" class="btn" style="background: white; border: 1px solid var(--primary-color); color: var(--primary-color); text-align: center; text-decoration: none;">Ask AI Tutor</a>
        </div>
    </div>
</div>
{% endblock %}
