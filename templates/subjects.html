<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    {% include 'sidebar_teacher.html' %}
    <div class="main-content">
        <div class="topbar">
            <h2>Subjects</h2>
            <div class="topbar-right">
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
        </div>
        <div class="container">
            <div class="page-header">
                <h3>Manage Subjects</h3>
                <button class="btn btn-primary" onclick="openModal('addSubjectModal')">Add Subject</button>
            </div>

            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Subject Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for subject in subjects %}
                        <tr>
                            <td>{{ subject.subject_name }}</td>
                            <td>
                                <form action="/teacher/delete_subject/{{ subject.id }}" method="POST" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addSubjectModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1.5rem;">Add Subject</h3>
            <form action="/teacher/add_subject" method="POST">
                <div style="margin-bottom: 1.5rem;">
                    <label>Subject Name</label>
                    <input type="text" name="subject_name" required>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addSubjectModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
