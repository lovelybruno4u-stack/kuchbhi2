<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance - ASWATHAMA CLASSES</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-brand">ASWATHAMA</div>
        <ul class="nav-links">
            <li class="nav-item"><a href="/student_dashboard" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a href="/my_videos" class="nav-link">Class Videos</a></li>
            <li class="nav-item"><a href="/attendance_view" class="nav-link active">My Attendance</a></li>
            <li class="nav-item"><a href="/chatbot" class="nav-link" style="background: linear-gradient(90deg, #4F46E5, #a855f7); color: white;">AI Tutor</a></li>
            <li class="nav-item"><a href="/announcements_view" class="nav-link">Announcements</a></li>
        </ul>
        <button id="logout-btn" class="logout-btn">Logout</button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="topbar">
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
            <h1 class="page-title">My Attendance Record</h1>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-table-body">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetchAndRenderTable('/api/attendance', 'attendance-table-body', ['date', 'status']);
    });
</script>
</body>
</html>
