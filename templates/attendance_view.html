{% extends 'base.html' %}
{% block content %}
<div class="top-header">
    <h1>My Attendance</h1>
</div>

<div class="card table-container">
    <h3>Attendance Record</h3>
    <table>
        <thead>
            <tr>
                <th>Date</th><th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for record in attendance %}
            <tr>
                <td>{{ record.date }}</td>
                <td>
                    {% if record.status == 'Present' %}
                        <span style="color: green; font-weight: 500;">Present</span>
                    {% else %}
                        <span style="color: red; font-weight: 500;">Absent</span>
                    {% endif %}
                </td>
            </tr>
            {% else %}
            <tr><td colspan="2" style="text-align: center;">No attendance records found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
