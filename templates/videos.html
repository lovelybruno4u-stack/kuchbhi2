<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - ASWATHAMA CLASSES</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-brand">ASWATHAMA</div>
        <ul class="nav-links">
            <li class="nav-item"><a href="/dashboard" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a href="/students" class="nav-link">Students</a></li>
            <li class="nav-item"><a href="/attendance" class="nav-link">Attendance</a></li>
            <li class="nav-item"><a href="/videos" class="nav-link active">Videos</a></li>
            <li class="nav-item"><a href="/subjects" class="nav-link">Subjects</a></li>
            <li class="nav-item"><a href="/announcements" class="nav-link">Announcements</a></li>
            <li class="nav-item"><a href="/ai_tools" class="nav-link" style="background: linear-gradient(90deg, #4F46E5, #a855f7); color: white;">AI Tools</a></li>
        </ul>
        <button id="logout-btn" class="logout-btn">Logout</button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="topbar">
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
            <h1 class="page-title">Daily Class Videos</h1>
            <button class="btn btn-primary" onclick="openModal('add-video-modal')">+ Upload Video</button>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Subject</th>
                            <th>Link</th>
                        </tr>
                    </thead>
                    <tbody id="videos-table-body">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Modal -->
<div id="add-video-modal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3>Add New Class Video</h3>
            <button class="modal-close" onclick="closeModal('add-video-modal')">&times;</button>
        </div>
        <form id="add-video-form">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="v-date" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="v-subject" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Google Drive Video Link</label>
                <input type="url" id="v-link" class="form-control" placeholder="https://drive.google.com/..." required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Save Video</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('v-date').valueAsDate = new Date();
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
