{% extends "base.html" %}

{% block title %}Manage Videos{% endblock %}

{% block content %}
<div class="flex-between mb-4">
    <h1>Class Videos</h1>
    <button class="btn btn-primary" onclick="document.getElementById('add-video-form').classList.toggle('hidden')">
        <i class="fa-solid fa-plus"></i> Add Video
    </button>
</div>

<div id="add-video-form" class="glass-card mb-4 hidden">
    <h2>Add New Video</h2>
    <form id="video-form">
        <div class="dashboard-grid">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="v_date" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Subject</label>
                <select id="v_subject" class="form-control" required>
                    <!-- Populated dynamically -->
                </select>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Google Drive Link</label>
                <input type="url" id="v_link" class="form-control" required placeholder="https://drive.google.com/...">
            </div>
        </div>
        <button type="submit" class="btn btn-secondary">Save Video</button>
    </form>
</div>

<div class="dashboard-grid" id="videos-container">
    <div style="grid-column: 1 / -1;" class="text-center text-muted">Loading videos...</div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.getElementById('v_date').valueAsDate = new Date();

    async function loadSubjects() {
        try {
            const data = await apiCall('/api/subjects');
            const select = document.getElementById('v_subject');
            select.innerHTML = '';
            if (data.length === 0) {
                select.innerHTML = '<option value="" disabled selected>Add subjects first</option>';
            } else {
                data.forEach(sub => {
                    select.innerHTML += `<option value="${sub.subject_name}">${sub.subject_name}</option>`;
                });
            }
        } catch (e) {}
    }

    async function loadVideos() {
        try {
            const data = await apiCall('/api/videos');
            const container = document.getElementById('videos-container');
            container.innerHTML = '';

            if(data.length === 0) {
                container.innerHTML = '<div style="grid-column: 1 / -1;" class="glass-card text-center text-muted">No videos found.</div>';
                return;
            }

            data.forEach(v => {
                container.innerHTML += `
                    <div class="glass-card">
                        <h3>${v.subject}</h3>
                        <p class="text-muted"><i class="fa-regular fa-calendar"></i> ${v.date}</p>
                        <div class="mt-4 flex-between">
                            <a href="${v.drive_link}" target="_blank" class="btn btn-primary"><i class="fa-solid fa-play"></i> Watch</a>
                            <button class="btn btn-danger" onclick="deleteVideo('${v.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        } catch (e) {}
    }

    async function deleteVideo(id) {
        if(confirm('Are you sure?')) {
            await apiCall('/api/videos/' + id, 'DELETE');
            loadVideos();
        }
    }

    document.getElementById('video-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            date: document.getElementById('v_date').value,
            subject: document.getElementById('v_subject').value,
            drive_link: document.getElementById('v_link').value
        };
        await apiCall('/api/videos', 'POST', payload);
        document.getElementById('video-form').reset();
        document.getElementById('v_date').valueAsDate = new Date();
        document.getElementById('add-video-form').classList.add('hidden');
        loadVideos();
    });

    document.addEventListener('DOMContentLoaded', () => {
        loadSubjects();
        loadVideos();
    });
</script>
{% endblock %}
