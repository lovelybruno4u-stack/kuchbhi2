{% extends 'base.html' %}
{% block page_title %}Class Videos{% endblock %}
{% block content %}

<div style="display: flex; justify-content: flex-end; margin-bottom: 1.5rem;">
    <button class="btn btn-primary" onclick="openModal('addVideoModal')">+ Upload Video Link</button>
</div>

<div class="table-container">
    <table id="videosTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Subject</th>
                <th>Drive Link</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="3" class="text-center">Loading...</td></tr>
        </tbody>
    </table>
</div>

<!-- Add Video Modal -->
<div class="modal-overlay" id="addVideoModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add Class Video</h3>
            <button class="modal-close" onclick="closeModal('addVideoModal')">&times;</button>
        </div>
        <form id="addVideoForm" onsubmit="addVideo(event)">
            <div class="form-group"><label>Date</label><input type="date" id="v_date" required></div>
            <div class="form-group"><label>Subject</label><input type="text" id="v_subject" required></div>
            <div class="form-group"><label>Google Drive Link</label><input type="url" id="v_link" required></div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Save Video</button>
        </form>
    </div>
</div>

{% endblock %}
{% block extra_js %}
<script>
    document.getElementById('v_date').valueAsDate = new Date();

    async function loadVideos() {
        const res = await apiCall('/api/videos');
        if(res.success) {
            const tbody = document.querySelector('#videosTable tbody');
            if(res.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center">No videos found.</td></tr>';
                return;
            }
            tbody.innerHTML = res.data.map(v => `
                <tr>
                    <td>${v.date}</td>
                    <td>${v.subject}</td>
                    <td><a href="${v.drive_link}" target="_blank" class="btn btn-sm btn-secondary">Watch Video</a></td>
                </tr>
            `).join('');
        }
    }

    async function addVideo(e) {
        e.preventDefault();
        const data = {
            date: document.getElementById('v_date').value,
            subject: document.getElementById('v_subject').value,
            drive_link: document.getElementById('v_link').value
        };
        const res = await apiCall('/api/videos', 'POST', data);
        if(res.success) {
            showAlert('Video added successfully');
            closeModal('addVideoModal');
            document.getElementById('addVideoForm').reset();
            document.getElementById('v_date').valueAsDate = new Date();
            loadVideos();
        } else {
            showAlert(res.error || 'Failed to add video', 'error');
        }
    }

    loadVideos();
</script>
{% endblock %}
