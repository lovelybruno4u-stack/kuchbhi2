{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div class="page-title">
        <h1>Class Videos</h1>
        <p>Manage and upload daily class recordings.</p>
    </div>
</div>

<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px;">
    <!-- Upload Form -->
    <div class="glass" style="padding: 24px; height: fit-content;">
        <h3>Add New Video</h3>
        <form onsubmit="submitVideo(event)" style="margin-top: 20px;">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="vid-date" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="vid-subject" class="form-control" placeholder="e.g., Physics" required>
            </div>
            <div class="form-group">
                <label>Google Drive Link</label>
                <input type="url" id="vid-link" class="form-control" placeholder="https://drive.google.com/..." required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%">Upload Video</button>
        </form>
    </div>

    <!-- Video List -->
    <div class="glass" style="padding: 24px;">
        <h3>Recent Videos</h3>
        <div class="table-container" style="margin-top: 20px;">
            <table id="videos-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Subject</th>
                        <th>Link</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('vid-date').valueAsDate = new Date();

    async function loadVideos() {
        const res = await apiCall('/api/videos');
        if (res && res.data) {
            const tbody = document.querySelector('#videos-table tbody');
            tbody.innerHTML = '';
            // Sort by date descending
            const sorted = res.data.sort((a,b) => new Date(b.date) - new Date(a.date));

            sorted.forEach(vid => {
                const tr = document.createElement('tr');
                tr.appendChild(createTableCell(vid.date));
                tr.appendChild(createTableCell(vid.subject));

                const linkTd = document.createElement('td');
                const a = document.createElement('a');
                a.href = vid.drive_link;
                a.target = '_blank';
                a.className = 'btn btn-secondary';
                a.style.padding = '4px 12px';
                a.textContent = 'Watch';
                linkTd.appendChild(a);
                tr.appendChild(linkTd);

                tbody.appendChild(tr);
            });
        }
    }

    async function submitVideo(e) {
        e.preventDefault();
        const data = {
            date: document.getElementById('vid-date').value,
            subject: document.getElementById('vid-subject').value,
            drive_link: document.getElementById('vid-link').value
        };

        const res = await apiCall('/api/videos', {
            method: 'POST',
            body: JSON.stringify(data)
        });

        if (res && res.success) {
            document.getElementById('vid-subject').value = '';
            document.getElementById('vid-link').value = '';
            loadVideos();
            showModal('Success', 'Video uploaded successfully');
        }
    }

    loadVideos();
</script>
{% endblock %}
