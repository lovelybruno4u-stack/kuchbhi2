<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    {% include 'sidebar_teacher.html' %}
    <div class="main-content">
        <div class="topbar">
            <h2>Daily Videos</h2>
            <div class="topbar-right">
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
        </div>
        <div class="container">
            <div class="page-header">
                <h3>Video Lectures</h3>
                <button class="btn btn-primary" onclick="openModal('addVideoModal')">Add Video</button>
            </div>

            <div class="grid grid-cols-3">
                {% for video in videos %}
                <div class="card">
                    <h4 style="margin-bottom: 0.5rem; color: var(--primary);">{{ video.subject }}</h4>
                    <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1rem;">Date: {{ video.date }}</p>
                    <div style="display: flex; gap: 0.5rem; flex-direction: column;">
                        <a href="{{ video.drive_link }}" target="_blank" class="btn btn-secondary" style="width: 100%;">View Video</a>
                        <form action="/teacher/delete_video/{{ video.id }}" method="POST">
                            <button type="submit" class="btn btn-danger" style="width: 100%;">Delete</button>
                        </form>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="addVideoModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1.5rem;">Add New Video</h3>
            <form action="/teacher/add_video" method="POST">
                <div style="margin-bottom: 1rem;">
                    <label>Date</label>
                    <input type="date" name="date" required value="{{ current_date }}">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label>Subject</label>
                    <input type="text" name="subject" required>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label>Google Drive Link</label>
                    <input type="url" name="drive_link" required>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addVideoModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
