{% extends 'base.html' %}
{% block content %}
<div class="top-header">
    <h1>Daily Class Videos</h1>
</div>

<div class="card" style="margin-bottom: 20px;">
    <h3>Add New Video</h3>
    <form method="POST" action="{{ url_for('add_video') }}" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" class="form-control" required value="{{ today }}">
        </div>
        <div class="form-group">
            <label>Subject</label>
            <select name="subject" class="form-control" required>
                {% for sub in subjects %}
                    <option value="{{ sub.subject_name }}">{{ sub.subject_name }}</option>
                {% else %}
                    <option value="General">General</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Google Drive Link</label>
            <input type="url" name="drive_link" class="form-control" placeholder="https://drive.google.com/..." required>
        </div>
        <button type="submit" class="btn btn-primary">Add Video</button>
    </form>
</div>

<div class="card table-container">
    <h3>Past Videos</h3>
    <table>
        <thead>
            <tr>
                <th>Date</th><th>Subject</th><th>Link</th>
            </tr>
        </thead>
        <tbody>
            {% for video in videos %}
            <tr>
                <td>{{ video.date }}</td>
                <td>{{ video.subject }}</td>
                <td><a href="{{ video.drive_link }}" target="_blank" style="color: var(--primary-color);">Watch Video</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
