{% extends 'base.html' %}
{% block page_title %}AI Teaching Tools{% endblock %}
{% block content %}

<div class="grid-2">
    <!-- Quiz Generator -->
    <div class="card glassmorphism">
        <h3 style="color: var(--primary);"><i class="fa-solid fa-file-circle-question"></i> AI Quiz Generator</h3>
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem;">Generate 5 MCQs instantly for any topic.</p>

        <div class="form-group">
            <label class="form-label">Subject</label>
            <input type="text" id="qSub" class="form-control" placeholder="e.g. Physics">
        </div>
        <div class="form-group">
            <label class="form-label">Topic</label>
            <input type="text" id="qTopic" class="form-control" placeholder="e.g. Newton's Laws">
        </div>
        <button class="btn btn-primary" onclick="generateQuiz()">Generate Quiz</button>

        <div id="quizResult" class="ai-response-box" style="display: none; white-space: pre-wrap; font-size: 0.9rem;"></div>
    </div>

    <!-- Video Summary -->
    <div class="card glassmorphism">
        <h3 style="color: var(--accent);"><i class="fa-solid fa-file-lines"></i> AI Video Summary</h3>
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem;">Create revision notes from a topic name.</p>

        <div class="form-group">
            <label class="form-label">Topic covered in video</label>
            <input type="text" id="vTopic" class="form-control" placeholder="e.g. Cell Structure and Function">
        </div>
        <button class="btn btn-primary" style="background-color: var(--accent);" onclick="generateSummary()">Generate Notes</button>

        <div id="summaryResult" class="ai-response-box" style="display: none; white-space: pre-wrap; font-size: 0.9rem;"></div>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script>
    async function generateQuiz() {
        const sub = document.getElementById('qSub').value;
        const topic = document.getElementById('qTopic').value;
        if(!sub || !topic) return showModal('Error', 'Fill both fields');

        const res = await apiCall('/api/ai/quiz', 'POST', { subject: sub, topic: topic });
        if(res && res.success) {
            const box = document.getElementById('quizResult');
            box.style.display = 'block';
            box.innerText = res.answer;
        }
    }

    async function generateSummary() {
        const topic = document.getElementById('vTopic').value;
        if(!topic) return showModal('Error', 'Provide a topic');

        const res = await apiCall('/api/ai/video-summary', 'POST', { topic: topic });
        if(res && res.success) {
            const box = document.getElementById('summaryResult');
            box.style.display = 'block';
            box.innerText = res.answer;
        }
    }
</script>
{% endblock %}
