{% extends 'base.html' %}
{% block title %}AI Tools{% endblock %}
{% block page_title %}AI Educational Tools{% endblock %}

{% block content %}
<div class="dashboard-grid">
    <div class="glass-card stat-card" style="cursor:pointer;" onclick="openAITool('quiz')">
        <div class="stat-icon"><i class="fas fa-question-circle"></i></div>
        <div class="stat-info">
            <h3>AI Quiz Generator</h3>
            <p>Generate MCQs</p>
        </div>
    </div>
    <div class="glass-card stat-card" style="cursor:pointer;" onclick="openAITool('attendance')">
        <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
        <div class="stat-info">
            <h3>Attendance Analyzer</h3>
            <p>AI Insights</p>
        </div>
    </div>
    <div class="glass-card stat-card" style="cursor:pointer;" onclick="openAITool('video')">
        <div class="stat-icon"><i class="fas fa-file-alt"></i></div>
        <div class="stat-info">
            <h3>Video Summarizer</h3>
            <p>Revision Notes</p>
        </div>
    </div>
</div>

<div class="glass-card mt-20" id="toolWorkspace" style="display:none;">
    <h3 id="toolTitle">Workspace</h3>

    <div id="quizInputs" style="display:none;" class="mt-3">
        <input type="text" id="quizSubject" class="form-control mb-3" placeholder="Subject">
        <input type="text" id="quizTopic" class="form-control mb-3" placeholder="Topic">
    </div>

    <div id="videoInputs" style="display:none;" class="mt-3">
        <input type="text" id="videoTopic" class="form-control mb-3" placeholder="Video Topic">
    </div>

    <button class="btn btn-primary mt-3" onclick="runAITool()">Generate</button>

    <div id="toolLoading" style="display:none; margin-top: 20px;">
        <i class="fas fa-spinner fa-spin"></i> Generating...
    </div>

    <div class="mt-3">
        <div id="toolOutput" style="background: rgba(255,255,255,0.5); padding: 15px; border-radius: 10px; min-height: 100px; white-space: pre-wrap;"></div>
    </div>
</div>

<script>
    let activeTool = '';

    function openAITool(tool) {
        activeTool = tool;
        document.getElementById('toolWorkspace').style.display = 'block';
        document.getElementById('quizInputs').style.display = 'none';
        document.getElementById('videoInputs').style.display = 'none';
        document.getElementById('toolOutput').textContent = '';

        if(tool === 'quiz') {
            document.getElementById('toolTitle').textContent = 'AI Quiz Generator';
            document.getElementById('quizInputs').style.display = 'block';
        } else if(tool === 'attendance') {
            document.getElementById('toolTitle').textContent = 'AI Attendance Analyzer';
        } else if(tool === 'video') {
            document.getElementById('toolTitle').textContent = 'AI Video Summarizer';
            document.getElementById('videoInputs').style.display = 'block';
        }
    }

    async function runAITool() {
        document.getElementById('toolLoading').style.display = 'block';
        document.getElementById('toolOutput').textContent = '';

        let endpoint = '';
        let payload = {};

        if(activeTool === 'quiz') {
            endpoint = '/api/ai/quiz';
            payload = {
                subject: document.getElementById('quizSubject').value,
                topic: document.getElementById('quizTopic').value
            };
        } else if(activeTool === 'attendance') {
            endpoint = '/api/ai/attendance';
        } else if(activeTool === 'video') {
            endpoint = '/api/ai/video_summary';
            payload = { topic: document.getElementById('videoTopic').value };
        }

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(data.success) {
                // Use DOM text node to prevent XSS
                document.getElementById('toolOutput').textContent = data.response;
            } else {
                document.getElementById('toolOutput').textContent = 'Error: ' + data.error;
            }
        } catch(e) {
            document.getElementById('toolOutput').textContent = 'Network error.';
        } finally {
            document.getElementById('toolLoading').style.display = 'none';
        }
    }
</script>
{% endblock %}
