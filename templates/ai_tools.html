{% extends 'base.html' %}

{% block content %}
<style>
.tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}
.tool-card {
    padding: 20px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}
.tool-card h3 {
    margin-top: 0;
    color: #4f46e5;
}
textarea, input[type="text"] {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
}
button.ai-btn {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
}
.output-box {
    margin-top: 15px;
    padding: 10px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    white-space: pre-wrap;
    display: none;
}
</style>

<div class="content-header">
    <h1>Teacher AI Tools</h1>
</div>

<div class="tools-grid">
    <!-- Attendance Analysis -->
    <div class="tool-card glass-card">
        <h3>AI Attendance Analysis</h3>
        <p>Analyze the full attendance database for insights.</p>
        <button class="ai-btn" onclick="runAttendance()">Analyze Now</button>
        <div id="attendanceOutput" class="output-box"></div>
    </div>

    <!-- Video Summary -->
    <div class="tool-card glass-card">
        <h3>AI Video Summary</h3>
        <input type="text" id="videoTopic" placeholder="Enter video topic (e.g. Thermodynamics Laws)">
        <button class="ai-btn" onclick="runVideoSummary()">Generate Summary</button>
        <div id="videoOutput" class="output-box"></div>
    </div>

    <!-- Quiz Generator -->
    <div class="tool-card glass-card">
        <h3>AI Quiz Generator</h3>
        <input type="text" id="quizTopic" placeholder="Enter subject and topic">
        <button class="ai-btn" onclick="runQuizGen()">Generate MCQs</button>
        <div id="quizOutput" class="output-box"></div>
    </div>

    <!-- Announcement -->
    <div class="tool-card glass-card">
        <h3>AI Announcements</h3>
        <textarea id="announcementContext" rows="3" placeholder="E.g. Holiday tomorrow due to heavy rain..."></textarea>
        <button class="ai-btn" onclick="runAnnouncement()">Draft Announcement</button>
        <div id="announcementOutput" class="output-box"></div>
    </div>
</div>

<script>
async function callApi(url, body, outputId) {
    const out = document.getElementById(outputId);
    out.style.display = 'block';
    out.textContent = 'Generating...';
    try {
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if(data.success) {
            out.textContent = data.result;
        } else {
            out.textContent = "Error: " + data.error;
            showCustomModal("Error: " + data.error);
        }
    } catch (e) {
        out.textContent = "Failed to connect.";
    }
}

function runAttendance() {
    callApi('/api/ai/attendance', {}, 'attendanceOutput');
}
function runVideoSummary() {
    const topic = document.getElementById('videoTopic').value;
    if(!topic) return showCustomModal("Please enter a topic.");
    callApi('/api/ai/video_summary', {topic}, 'videoOutput');
}
function runQuizGen() {
    const topic = document.getElementById('quizTopic').value;
    if(!topic) return showCustomModal("Please enter a topic.");
    callApi('/api/ai/quiz', {topic}, 'quizOutput');
}
function runAnnouncement() {
    const context = document.getElementById('announcementContext').value;
    if(!context) return showCustomModal("Please enter context.");
    callApi('/api/ai/announcement', {context}, 'announcementOutput');
}
</script>
{% endblock %}
